name: Check NPC ItemShop runtime

on:
  push:
    paths:
      - 'src/stoneage_npc_itemshop_runtime.mjs'
      - 'src/stoneage_item_source_runtime.mjs'
      - 'src/stoneage_item_economy_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/generate_npc_itemshop_runtime.mjs'
      - 'tools/check_npc_itemshop_runtime.mjs'
      - 'tools/fixtures/npc-itemshop/**'
      - '.github/workflows/check-npc-itemshop-runtime.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run NPC ItemShop runtime regression
        run: node tools/check_npc_itemshop_runtime.mjs

      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_npc_itemshop_runtime.mjs
          node --check tools/generate_npc_itemshop_runtime.mjs
          node --check tools/check_npc_itemshop_runtime.mjs
      - name: Run generator fixture
        run: |
          node tools/generate_npc_itemshop_runtime.mjs \
            --source-root tools/fixtures/npc-itemshop/source \
            --out /tmp/stoneage_npc_itemshop_runtime.json
          node -e "const x=require('/tmp/stoneage_npc_itemshop_runtime.json'); if(x.stats.shopBindings!==2||x.stats.totalOfferRows!==6||x.floorIndex['1001'][0]!=='gmsv/data/npc/fixture.create#0'||x.itemIndex['46'][0].offerIndex!==4) process.exit(1); console.log(JSON.stringify({generatorPass:true,stats:x.stats}))"
