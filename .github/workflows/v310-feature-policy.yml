name: V3.10 feature policy

on:
  push:
    paths:
      - 'data/generated/stoneage_disabled_features.json'
      - 'start.html'
      - 'game.js'
      - 'tools/check_v310_feature_policy.mjs'
      - '.github/workflows/v310-feature-policy.yml'
  pull_request:
    paths:
      - 'data/generated/stoneage_disabled_features.json'
      - 'start.html'
      - 'game.js'
      - 'tools/check_v310_feature_policy.mjs'
      - '.github/workflows/v310-feature-policy.yml'
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp start.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check feature policy
        run: node tools/check_v310_feature_policy.mjs
      - name: Check game.js syntax
        run: node --check game.js
