name: V2.95 Guardian no second suit dodge

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/changelog/part-07-v1.75-onward.md'
      - 'tools/check_v294_duck_jyujyutu_kawashipara.mjs'
      - 'tools/check_v295_guardian_no_second_suit_dodge.mjs'
      - '.github/workflows/v294-duck-jyujyutu-kawashipara.yml'
      - '.github/workflows/v295-guardian-no-second-suit-dodge.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.94 JYUJYUTU KawashiPara source branch audit
        run: node tools/check_v294_duck_jyujyutu_kawashipara.mjs
      - name: Run V2.95 Guardian no-second-suit-dodge audit
        run: node tools/check_v295_guardian_no_second_suit_dodge.mjs
