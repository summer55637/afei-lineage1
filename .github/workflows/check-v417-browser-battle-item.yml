name: Check V4.17 Browser Battle Item Plan

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_item_runtime.mjs'
      - 'src/stoneage_reward_transaction.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/check_v417_browser_battle_item.mjs'
      - 'data/generated/stoneage_browser_battle_item_schema.json'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_item_runtime.mjs'
      - 'src/stoneage_reward_transaction.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/check_v417_browser_battle_item.mjs'
      - 'data/generated/stoneage_browser_battle_item_schema.json'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_v417_browser_battle_item.mjs
