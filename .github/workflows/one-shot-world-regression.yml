name: one-shot-world-regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run world catalog regressions
        run: |
          node tools/check_world_data_catalog.mjs
          node tools/check_world_npc_and_map_audit.mjs
          node tools/check_npc_service_index.mjs
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-world-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-world-regression.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: remove one-shot world regression"
          git push origin HEAD:main
