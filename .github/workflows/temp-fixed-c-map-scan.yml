name: temporary fixed-C map header scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan pinned fixed-C map headers
        shell: bash
        run: |
          set -euo pipefail
          REF="1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
          rm -rf StoneAge
          git clone --quiet --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git StoneAge
          cd StoneAge
          git -c advice.detachedHead=false checkout --quiet "$REF"
          python3 - <<'PY'
          import hashlib, json, os, struct
          from collections import defaultdict, deque

          REF="1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
          ROOT="gmsv/data/map"

          def blob_sha(b):
              return hashlib.sha1(("blob %d\0"%len(b)).encode()+b).hexdigest()

          def parse_map(path):
              b=open(path,"rb").read()
              if len(b)<44 or b[:6]!=b"LS2MAP":
                  return None
              floor,width,height=struct.unpack(">HHH",b[6:8]+b[40:42]+b[42:44])
              n=width*height
              if len(b)!=(44+4*n):
                  return {"path":path,"floorId":floor,"width":width,"height":height,"blobSha":blob_sha(b),"sizeMatchesHeader":False}
              off=44
              tiles=list(struct.unpack(">%dH"%n,b[off:off+2*n]))
              off+=2*n
              objs=list(struct.unpack(">%dH"%n,b[off:off+2*n]))
              return {"path":path,"floorId":floor,"width":width,"height":height,"blobSha":blob_sha(b),"sizeMatchesHeader":True,"tiles":tiles,"objects":objs}

          maps=[]
          for dp,_,fs in os.walk(ROOT):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  m=parse_map(p)
                  if m and m.get("sizeMatchesHeader"):
                      maps.append(m)

          # Parse mapset walkability from the same fixed source.
          walk={}
          with open("gmsv/data/map/mapset.txt","r",encoding="gb18030",errors="ignore") as f:
              for raw in f:
                  raw=raw.strip()
                  if not raw or raw.startswith("#"): continue
                  p=raw.split(",")
                  if not p: continue
                  try: image=int(p[0])
                  except: continue
                  # Fixed-C MAP_getImageInt() treats MAP_WALKABLE as a flag field.
                  # mapset rows in this source store walkability in the flag column.
                  vals=[]
                  for v in p[1:]:
                      try: vals.append(int(v))
                      except: vals.append(0)
                  walk[image]=1 if 1 in vals else 0

          # Use the known fixed-C group/encounter sources.
          groups={}
          with open("gmsv/data/group1.txt","r",encoding="gb18030",errors="ignore") as f:
              for raw in f:
                  raw=raw.rstrip("\n\r")
                  if not raw: continue
                  p=raw.split(",")
                  if len(p)<4: continue
                  try: gid=int(p[1])
                  except: continue
                  vals=[]
                  for v in p[1:]:
                      try: vals.append(int(v))
                      except: vals.append(None)
                  groups[gid]={
                    "appearByItemId":vals[1],
                    "notAppearByItemId":vals[2],
                    "enemyIds":[x for x in vals[3:13] if x is not None]
                  }

          enc={}
          with open("gmsv/data/encount.txt","r",encoding="gb18030",errors="ignore") as f:
              for ln,raw in enumerate(f,1):
                  raw=raw.rstrip("\n\r")
                  if not raw or raw.startswith("#"): continue
                  p=raw.split(",")
                  if len(p)<10: continue
                  try: floor=int(p[1])
                  except: continue
                  if floor not in (100,200): continue
                  gids=[]
                  for v in p[10:20]:
                      try:
                          x=int(v)
                          if x>=0: gids.append(x)
                      except: pass
                  if not gids: continue
                  rows={
                    "line":ln,"index":int(p[0]),"floor":floor,
                    "x1":int(p[2]),"y1":int(p[3]),"x2":int(p[4]),"y2":int(p[5]),
                    "probMin":int(p[6]),"probMax":int(p[7]),"enemyMax":int(p[8]),
                    "groupIds":gids
                  }
                  rows["rect"]={"x1":min(rows["x1"],rows["x2"]),"y1":min(rows["y1"],rows["y2"]),
                                "x2":max(rows["x1"],rows["x2"]),"y2":max(rows["y1"],rows["y2"])}
                  rows["unconditionalGroupIds"]=[
                    gid for gid in gids
                    if gid in groups
                    and groups[gid]["appearByItemId"] in (-1,None)
                    and groups[gid]["notAppearByItemId"] in (-1,None)
                  ]
                  rows["hasUnconditionalGroup"]=len(rows["unconditionalGroupIds"])>0 and rows["probMax"]>0
                  enc[rows["index"]]=rows

          route_landings={
            100:[
              {"fromFloor":1000,"source":[98,44],"to":[637,491]},
              {"fromFloor":1000,"source":[98,45],"to":[637,494]},
              {"fromFloor":2000,"source":[56,48],"to":[79,614]},
              {"fromFloor":2000,"source":[57,48],"to":[79,617]}
            ],
            200:[
              {"fromFloor":3000,"source":[90,60],"to":[570,376]},
              {"fromFloor":3000,"source":[90,60],"to":[587,313]},
              {"fromFloor":4000,"source":[80,90],"to":[304,599]},
              {"fromFloor":4000,"source":[80,91],"to":[301,640]}
            ]
          }

          focus={}
          for floor,landings in route_landings.items():
              fm=[m for m in maps if m["floorId"]==floor]
              focus[str(floor)]={
                "mapCandidates":[{k:v for k,v in m.items() if k in ("path","blobSha","floorId","width","height","sizeMatchesHeader")} for m in fm]
              }
              if len(fm)!=1:
                  focus[str(floor)]["status"]="ambiguous_map_floor"
                  continue
              m=fm[0]
              results=[]
              for item in landings:
                  x,y=item["to"]
                  inb=0<=x<m["width"] and 0<=y<m["height"]
                  if not inb:
                      results.append({**item,"inBounds":False})
                      continue
                  i=y*m["width"]+x
                  tile,ob=m["tiles"][i],m["objects"][i]
                  results.append({
                    **item,"inBounds":True,"tile":tile,"object":ob,
                    "tileWalkable":walk.get(tile,0)==1,
                    "objectWalkable":walk.get(ob,0)==1,
                    "walkable":walk.get(tile,0)==1 and walk.get(ob,0)==1,
                    "encounterRowsContainingLanding":[
                      {"index":r["index"],"line":r["line"],"rect":r["rect"],"hasUnconditionalGroup":r["hasUnconditionalGroup"],
                       "unconditionalGroupIds":r["unconditionalGroupIds"],"probMin":r["probMin"],"probMax":r["probMax"],"enemyMax":r["enemyMax"],"groupIds":r["groupIds"]}
                      for r in enc.values()
                      if r["x1"]<=x<=r["x2"] and r["y1"]<=y<=r["y2"] and r["probMax"]>0
                    ]
                  })
              focus[str(floor)]["landings"]=results
              focus[str(floor)]["allLandingWalkable"]=all(x.get("walkable",False) for x in results)
              focus[str(floor)]["allLandingsHaveUnconditionalEncounter"]=all(
                  any(r["hasUnconditionalGroup"] for r in x.get("encounterRowsContainingLanding",[]))
                  for x in results
              )

          # Record all duplicate focus IDs and the exact reason floor 200's large map matters.
          byfloor=defaultdict(list)
          for m in maps: byfloor[m["floorId"]].append({k:v for k,v in m.items() if k in ("path","blobSha","floorId","width","height","sizeMatchesHeader")})
          print(json.dumps({
            "fixedSource":REF,
            "mapFileCount":len(maps),
            "duplicateFloorIds":{str(k):v for k,v in byfloor.items() if len(v)>1},
            "focusFloors":{str(k):byfloor.get(k,[]) for k in (100,200,1000,2000,3000,4000)},
            "firstRouteWorldLandingAudit":focus
          },ensure_ascii=False))
          PY
