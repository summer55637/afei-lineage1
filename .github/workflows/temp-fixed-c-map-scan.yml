name: temporary fixed-C map header scan

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan pinned fixed-C map headers
        shell: bash
        run: |
          set -euo pipefail
          REF="1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
          rm -rf StoneAge
          git clone --quiet --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git StoneAge
          cd StoneAge
          git -c advice.detachedHead=false checkout --quiet "$REF"
          python3 - <<'PY'
          import hashlib, json, os, struct
          from collections import defaultdict, deque

          REF="1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
          ROOT="gmsv/data/map"
          mapset=json.load(open("data/generated/stoneage_mapset_runtime.json",encoding="utf-8"))
          walk=mapset.get("walkableByImageId",{})

          def blob_sha(b):
              return hashlib.sha1(("blob %d\0"%len(b)).encode()+b).hexdigest()

          def parse_map(path):
              b=open(path,"rb").read()
              if len(b)<44 or b[:6]!=b"LS2MAP": return None
              floor,width,height=struct.unpack(">HHH",b[6:8]+b[40:42]+b[42:44])
              n=width*height
              if len(b)!=(44+4*n): return None
              off=44
              tiles=list(struct.unpack(">%dH"%n,b[off:off+2*n])); off+=2*n
              objs=list(struct.unpack(">%dH"%n,b[off:off+2*n]))
              return {"path":path,"floorId":floor,"width":width,"height":height,"blobSha":blob_sha(b),"tiles":tiles,"objects":objs}

          maps=[]
          for dp,_,fs in os.walk(ROOT):
              for fn in fs:
                  p=os.path.join(dp,fn); m=parse_map(p)
                  if m: maps.append(m)

          groups={}
          with open("StoneAge/gmsv/data/group1.txt",encoding="gb18030",errors="ignore") as f:
            for raw in f:
              raw=raw.rstrip("\r\n"); p=raw.split(",")
              if len(p)<4: continue
              try: gid=int(p[1])
              except: continue
              vals=[]
              for v in p[1:]:
                try: vals.append(int(v))
                except: vals.append(None)
              groups[gid]={"appearByItemId":vals[1],"notAppearByItemId":vals[2],"enemyIds":[x for x in vals[3:13] if x is not None]}

          encounters=[]
          with open("StoneAge/gmsv/data/encount.txt",encoding="gb18030",errors="ignore") as f:
            for ln,raw in enumerate(f,1):
              raw=raw.rstrip("\r\n"); p=raw.split(",")
              if len(p)<10: continue
              try: floor=int(p[1]); probMax=int(p[7])
              except: continue
              if floor not in (100,200) or probMax<=0: continue
              gids=[]
              for v in p[10:20]:
                try:
                  gid=int(v)
                  if gid>=0: gids.append(gid)
                except: pass
              if not gids: continue
              rect=(min(int(p[2]),int(p[4])),min(int(p[3]),int(p[5])),max(int(p[2]),int(p[4])),max(int(p[3]),int(p[5])))
              unc=[gid for gid in gids if gid in groups and groups[gid]["appearByItemId"]==-1 and groups[gid]["notAppearByItemId"]==-1]
              encounters.append({"line":ln,"index":int(p[0]),"floor":floor,"rect":rect,"probMin":int(p[6]),"probMax":probMax,"enemyMax":int(p[8]),"groupIds":gids,"unconditionalGroupIds":unc,"hasUnconditionalGroup":bool(unc)})

          route_landings={
            100:[
              {"fromFloor":1000,"source":[98,44],"to":[637,491]},
              {"fromFloor":1000,"source":[98,45],"to":[637,494]},
              {"fromFloor":2000,"source":[56,48],"to":[79,614]},
              {"fromFloor":2000,"source":[57,48],"to":[79,617]}
            ],
            200:[
              {"fromFloor":3000,"source":[90,60],"to":[570,376]},
              {"fromFloor":3000,"source":[90,60],"to":[587,313]},
              {"fromFloor":4000,"source":[80,90],"to":[304,599]},
              {"fromFloor":4000,"source":[80,91],"to":[301,640]}
            ]
          }

          def is_walk(m,x,y):
              if x<0 or y<0 or x>=m["width"] or y>=m["height"]: return False
              i=y*m["width"]+x
              return walk.get(str(m["tiles"][i]),0)==1 and walk.get(str(m["objects"][i]),0)==1

          def containing_rows(floor,x,y):
              return [r for r in encounters if r["floor"]==floor and r["rect"][0]<=x<=r["rect"][2] and r["rect"][1]<=y<=r["rect"][3]]

          focus={}
          for floor,items in route_landings.items():
              candidates=[m for m in maps if m["floorId"]==floor]
              # Select the source map that can contain every first-route destination coordinate.
              valid=[m for m in candidates if all(0<=it["to"][0]<m["width"] and 0<=it["to"][1]<m["height"] for it in items)]
              focus[str(floor)]={"mapCandidates":[{k:v for k,v in m.items() if k in ("path","floorId","width","height","blobSha")} for m in candidates]}
              if len(valid)!=1:
                focus[str(floor)]["status"]="ambiguous_or_missing_containing_map"
                continue
              m=valid[0]; land=[]
              for item in items:
                x,y=item["to"]; i=y*m["width"]+x
                directWalk=is_walk(m,x,y)
                rows=containing_rows(floor,x,y)
                # Find the nearest walkable cell reachable from the warp landing, allowing the landing cell itself to be non-walkable.
                q=deque([(x,y,0)]); seen={(x,y)}; firstWalk=None
                while q and firstWalk is None:
                  cx,cy,dist=q.popleft()
                  if dist>0 and is_walk(m,cx,cy):
                    firstWalk=(cx,cy,dist)
                    break
                  for nx,ny in ((cx+1,cy),(cx-1,cy),(cx,cy+1),(cx,cy-1)):
                    if 0<=nx<m["width"] and 0<=ny<m["height"] and (nx,ny) not in seen:
                      seen.add((nx,ny)); q.append((nx,ny,dist+1))
                encounterWalkable=None
                if rows and firstWalk:
                  # Use BFS from first walkable cell until an unconditional encounter rectangle is reached.
                  q=deque([(firstWalk[0],firstWalk[1],firstWalk[2])]); seen={(firstWalk[0],firstWalk[1])}
                  hit=None
                  targetRects=[r for r in rows if r["hasUnconditionalGroup"]]
                  while q and hit is None:
                    cx,cy,dist=q.popleft()
                    if any(rr["rect"][0]<=cx<=rr["rect"][2] and rr["rect"][1]<=cy<=rr["rect"][3] for rr in targetRects):
                      hit=(cx,cy,dist); break
                    for nx,ny in ((cx+1,cy),(cx-1,cy),(cx,cy+1),(cx,cy-1)):
                      if 0<=nx<m["width"] and 0<=ny<m["height"] and (nx,ny) not in seen and is_walk(m,nx,ny):
                        seen.add((nx,ny)); q.append((nx,ny,dist+1))
                  if hit: encounterWalkable={"hit":[hit[0],hit[1]],"walkStepsFromLanding":hit[2]}
                land.append({**item,"tile":m["tiles"][i],"object":m["objects"][i],"directWalkable":directWalk,
                             "nearestWalkableAfterWarp":firstWalk,
                             "encounterRowsContainingLanding":[{"index":r["index"],"line":r["line"],"rect":r["rect"],"hasUnconditionalGroup":r["hasUnconditionalGroup"],"unconditionalGroupIds":r["unconditionalGroupIds"]} for r in rows],
                             "unconditionalEncounterReachable":encounterWalkable})
              focus[str(floor)]["selectedMap"]={k:v for k,v in m.items() if k in ("path","floorId","width","height","blobSha")}
              focus[str(floor)]["landings"]=land
              focus[str(floor)]["allDirectLandingWalkable"]=all(x["directWalkable"] for x in land)
              focus[str(floor)]["allPostWarpHasWalkableCell"]=all(x["nearestWalkableAfterWarp"] is not None for x in land)
              focus[str(floor)]["allPostWarpReachesUnconditionalEncounter"]=all(x["unconditionalEncounterReachable"] is not None for x in land)

          print(json.dumps({
            "fixedSource":REF,
            "mapFileCount":len(maps),
            "focusFloors":{str(k):focus.get(str(k),{}) for k in (100,200)},
            "duplicateFocusMapIds":{"200":[{k:v for k,v in m.items() if k in ("path","floorId","width","height","blobSha")} for m in maps if m["floorId"]==200]}
          },ensure_ascii=False))
          PY
