name: Check endpoint mapwarp audit

on:
  push:
    branches:
      - main
    paths:
      - 'ro0000/server/merged-source/gmsv/data/map/mapwarp.txt'
      - 'data/generated/stoneage_endpoint_mapwarp_audit.json'
      - 'tools/check_endpoint_mapwarp_audit.mjs'
      - 'docs/reference/endpoint-mapwarp-audit.md'
      - '.github/workflows/check-endpoint-mapwarp-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-mapwarp-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone pinned fixed-C source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Check endpoint mapwarp audit
        run: node tools/check_endpoint_mapwarp_audit.mjs --check