name: Check V4.46 browser battle round runtime
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_round_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_battle_status_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_preflight_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_plan_runtime.mjs'
      - 'src/stoneage_browser_battle_critical_damage_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_react_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_death_chain_runtime.mjs'
      - 'src/stoneage_browser_battle_end_runtime.mjs'
      - 'tools/check_v446_browser_battle_round_runtime.mjs'
      - 'docs/reference/v446-browser-battle-round-runtime.md'
      - '.github/workflows/check-v446-browser-battle-round-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V4.46 basic battle round regression
        run: node tools/check_v446_browser_battle_round_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_round_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v446_browser_battle_round_runtime.mjs
