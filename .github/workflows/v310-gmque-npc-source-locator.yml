name: V3.10 GMQUE NPC source locator

on:
  push:
    paths:
      - 'game.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/reference/gmque-npc-source-contract.md'
      - 'data/generated/stoneage_gmque_source_closure.json'
      - 'tools/check_v310_gmque_npc_source_locator.mjs'
      - '.github/workflows/v310-gmque-npc-source-locator.yml'
      - 'data/npc/**'
      - 'gmsv/data/npc/**'
      - 'source/data/npc/**'
      - 'vendor/data/npc/**'
      - 'references/data/npc/**'
      - 'reference/data/npc/**'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run GMQUE NPC source locator
        run: node tools/check_v310_gmque_npc_source_locator.mjs
      - name: Run GMQUE source closure regression
        run: node tools/check_v310_gmque_source_closure.mjs
