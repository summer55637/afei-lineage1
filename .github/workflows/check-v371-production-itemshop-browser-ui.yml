name: Check V3.71 production ItemShop Browser UI penetration
on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_itemshop_ui_state.mjs'
      - 'src/stoneage_browser_itemshop_runtime.mjs'
      - 'src/stoneage_browser_world_itemshop_runtime.mjs'
      - 'src/stoneage_browser_world_npc_runtime.mjs'
      - 'src/stoneage_item_economy_runtime.mjs'
      - 'src/stoneage_item_source_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/generate_world_data_catalog.mjs'
      - 'tools/generate_npc_itemshop_runtime.mjs'
      - 'tools/check_v371_production_itemshop_browser_ui.mjs'
      - 'docs/reference/v371-production-itemshop-browser-ui.md'
      - 'data/generated/stoneage_production_itemshop_browser_ui_schema.json'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v371-production-itemshop-browser-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-penetration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C StoneAge source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: stoneage-source
          fetch-depth: 1
      - name: Generate production World NPC catalog
        run: |
          rm -rf /tmp/v371-world
          mkdir -p /tmp/v371-world
          node tools/generate_world_data_catalog.mjs --source-root stoneage-source --out-dir /tmp/v371-world
      - name: Generate production ItemShop catalog
        run: |
          node tools/generate_npc_itemshop_runtime.mjs --source-root stoneage-source --out /tmp/v371-world/stoneage_npc_itemshop_runtime.json
      - name: Run V3.71 production Browser UI regression
        run: node tools/check_v371_production_itemshop_browser_ui.mjs stoneage-source /tmp/v371-world
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_itemshop_ui_state.mjs
          node --check src/stoneage_browser_itemshop_runtime.mjs
          node --check src/stoneage_browser_world_itemshop_runtime.mjs
          node --check src/stoneage_browser_world_npc_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v371_production_itemshop_browser_ui.mjs