name: One-time cleanup of legacy playable web files

on:
  push:
    paths:
      - ".github/workflows/cleanup-legacy-web.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Remove legacy web files from every non-main branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          for remote_ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
            branch="${remote_ref#refs/remotes/origin/}"
            [ "$branch" = "main" ] && continue
            [ "$branch" = "HEAD" ] && continue

            safe="$(echo "$branch" | tr '/ ' '__')"
            workdir="$RUNNER_TEMP/cleanup-$safe"
            rm -rf "$workdir"
            git worktree add --detach "$workdir" "$remote_ref"

            (
              cd "$workdir"
              changed=0
              for file in ./*.html ./*.htm ./app.js ./game.js ./game.css ./styles.css; do
                [ -e "$file" ] || continue
                rm -f "$file"
                changed=1
              done

              if [ "$changed" -eq 1 ]; then
                git add -u
                git commit -m "Remove legacy playable web files"
                git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
              fi
            )

            git worktree remove --force "$workdir"
          done

      - name: Remove this temporary cleanup workflow from main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-legacy-web.yml
          git add -u .github/workflows/cleanup-legacy-web.yml
          git commit -m "Remove one-time web cleanup workflow"
          git push origin main
