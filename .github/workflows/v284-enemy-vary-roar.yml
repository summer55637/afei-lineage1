name: V2.84 enemy Vary/Roar source regression

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'README.md'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'data/generated/stoneage_enemy_ai.json'
      - 'tools/check_v284_enemy_vary_roar.mjs'
      - '.github/workflows/v284-enemy-vary-roar.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.84 enemy Vary/Roar source regression
        run: node tools/check_v284_enemy_vary_roar.mjs
