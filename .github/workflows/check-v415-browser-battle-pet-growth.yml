name: Check V4.15 Browser Battle Pet Growth Plan

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_pet_growth_runtime.mjs'
      - 'src/stoneage_browser_battle_levelup_runtime.mjs'
      - 'src/stoneage_new_player_starter_pet_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_browser_battle_pet_growth_schema.json'
      - 'tools/check_v415_browser_battle_pet_growth.mjs'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_pet_growth_runtime.mjs'
      - 'src/stoneage_browser_battle_levelup_runtime.mjs'
      - 'src/stoneage_new_player_starter_pet_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_browser_battle_pet_growth_schema.json'
      - 'tools/check_v415_browser_battle_pet_growth.mjs'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_v415_browser_battle_pet_growth.mjs
