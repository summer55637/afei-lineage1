name: Check V3.21 NPC event runtime

on:
  push:
    paths:
      - 'src/stoneage_npc_event_runtime.mjs'
      - 'tools/check_npc_event_runtime.mjs'
      - 'data/generated/stoneage_new_player_event_closure.json'
      - 'docs/reference/v321-npc-event-plan-runtime.md'
      - '.github/workflows/check-v321-npc-event-runtime.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_npc_event_runtime.mjs
          node --check tools/check_npc_event_runtime.mjs
      - name: Run V3.21 NPC event regression
        run: node tools/check_npc_event_runtime.mjs
