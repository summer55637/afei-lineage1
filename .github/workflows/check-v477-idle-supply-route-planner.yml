name: check-v477-idle-supply-route-planner

on:
  push:
    branches: [main]
    paths:
      - 'src/stoneage_browser_idle_supply_route_runtime.mjs'
      - 'tools/generate_idle_supply_warp_catalog.mjs'
      - 'tools/check_v477_idle_supply_route_planner.mjs'
      - 'data/generated/stoneage_start_destination_warp_coordinates.json'
      - 'data/generated/stoneage_first_idle_route_catalog.json'
      - 'data/generated/stoneage_recovery_service_source_catalog.json'
      - 'data/generated/stoneage_map_runtime_index.json'
      - 'data/generated/stoneage_map_100.json'
      - 'data/generated/stoneage_map_200.json'
      - 'data/generated/stoneage_map_1000.json'
      - 'data/generated/stoneage_map_2000.json'
      - 'data/generated/stoneage_map_3000.json'
      - 'data/generated/stoneage_map_4000.json'
      - 'data/generated/stoneage_map_1005.json'
      - 'data/generated/stoneage_map_2005.json'
      - 'data/generated/stoneage_map_3005.json'
      - 'data/generated/stoneage_map_4005.json'
      - 'data/generated/stoneage_mapset_runtime.json'
      - '.github/workflows/check-v477-idle-supply-route-planner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  idle-supply-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clone pinned fixed-C source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Generate exact idle supply warp catalog
        run: |
          node tools/generate_idle_supply_warp_catalog.mjs             --source-root fixed-c-source             --out data/generated/stoneage_idle_supply_warp_catalog.json

      - name: Run V4.77 route planner regression
        run: node tools/check_v477_idle_supply_route_planner.mjs

      - name: Syntax check
        run: |
          node --check src/stoneage_browser_idle_supply_route_runtime.mjs
          node --check tools/generate_idle_supply_warp_catalog.mjs
          node --check tools/check_v477_idle_supply_route_planner.mjs

      - name: Commit generated supply warp catalog safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "V4.77 generated catalog commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            node tools/generate_idle_supply_warp_catalog.mjs               --source-root fixed-c-source               --out data/generated/stoneage_idle_supply_warp_catalog.json

            git add data/generated/stoneage_idle_supply_warp_catalog.json
            if git diff --cached --quiet; then
              echo "Idle supply warp catalog already current."
              exit 0
            fi

            git commit -m "[docs] auto-update V4.77 idle supply warp catalog"
            if git push origin HEAD:main; then
              echo "Idle supply warp catalog pushed."
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest origin/main."
          done

          echo "V4.77 generated catalog update could not be pushed after 3 attempts."
          exit 1
