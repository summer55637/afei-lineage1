name: V2.80 source boundary audit regression

on:
  push:
    paths:
      - 'game.js'
      - 'start.html'
      - 'data/generated/stoneage_general_encounter_runtime.json'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'data/generated/stoneage_attack_magic_runtime.json'
      - 'tools/check_v280_source_boundaries.mjs'
      - '.github/workflows/v280-source-boundaries.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp start.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.80 source boundary regression
        run: node tools/check_v280_source_boundaries.mjs