name: Check V3.96 Browser Player Battle Command
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_player_command_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_browser_player_battle_command_schema.json'
      - 'tools/check_v396_browser_battle_player_command_runtime.mjs'
      - 'docs/reference/v396-browser-player-battle-command.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v396-browser-player-battle-command.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.96 player battle command regression
        run: node tools/check_v396_browser_battle_player_command_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_player_command_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v396_browser_battle_player_command_runtime.mjs
