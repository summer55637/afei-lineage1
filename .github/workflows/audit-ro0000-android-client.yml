name: Audit RO0000 Android client evidence

on:
  push:
    paths:
      - 'ro0000/client/android/冰河石器-隐盟.apk'
      - 'tools/audit_ro0000_android_apk.py'
      - 'tools/check_ro0000_android_apk_audit.py'
      - 'tools/audit_ro0000_android_native.py'
      - 'tools/check_ro0000_android_native.py'
      - '.github/workflows/audit-ro0000-android-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install multi-architecture disassembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-multiarch
          objdump -i
      - name: Test APK string scanner
        run: python3 -m unittest discover -s tools -p 'check_ro0000_android_apk_audit.py'
      - name: Test native ELF audit parsers
        run: python3 -m unittest discover -s tools -p 'check_ro0000_android_native.py'
      - name: Audit APK archive and manifest
        run: python3 tools/audit_ro0000_android_apk.py --apk 'ro0000/client/android/冰河石器-隐盟.apk' --output artifacts/ro0000_android_apk_audit.json --baseline data/generated/stoneage_ro0000_android_apk_audit.json
      - name: Audit embedded native ELF binaries
        run: python3 tools/audit_ro0000_android_native.py --apk 'ro0000/client/android/冰河石器-隐盟.apk' --output artifacts/ro0000_android_native_elf_audit.json --extract-dir artifacts/native
      - name: Publish audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ro0000-android-apk-audit
          path: |
            artifacts/ro0000_android_apk_audit.json
            artifacts/ro0000_android_native_elf_audit.json
            artifacts/native/**/*.so
          if-no-files-found: error
          retention-days: 30
