name: one-shot-world-npc-audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fixed StoneAge source
        run: |
          rm -rf /tmp/StoneAge /tmp/world-audit
          git clone --quiet https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          cd /tmp/StoneAge
          git checkout --quiet 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          test "$(git rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"

      - name: Generate temporary indexes
        run: node tools/generate_world_data_catalog.mjs --source-root /tmp/StoneAge --out-dir /tmp/world-audit

      - name: Print focused audit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='/tmp/world-audit/stoneage_world_npc_index.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('UNKNOWN_FUNCTIONSETS');
          console.log(JSON.stringify(j.unknownFunctionSets,null,2));
          const unresolved=[];
          for(const c of j.creates){
            for(const e of (c.enemy||[])){
              if(e.fileRef && e.fileExists===false){
                unresolved.push({createPath:c.path,blockIndex:c.blockIndex,line:c.startLine,floorId:c.floorId,name:c.name,templateName:e.templateName,fileRef:e.fileRef});
              }
            }
          }
          console.log('UNRESOLVED_FILE_REFS_COUNT',unresolved.length);
          console.log(JSON.stringify(unresolved,null,2));
          const service=j.dataFunctionSets.slice(0,100);
          console.log('FUNCTIONSET_COUNTS');
          console.log(JSON.stringify(service,null,2));
          NODE

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-world-npc-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-world-npc-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci: remove one-shot world NPC audit"
          git push origin HEAD:main
