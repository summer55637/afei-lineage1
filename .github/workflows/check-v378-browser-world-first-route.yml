name: Check V3.78 Browser World First-Route planning
on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_first_route_runtime.mjs'
      - 'src/stoneage_browser_world_movement_runtime.mjs'
      - 'src/stoneage_browser_world_warppoint_runtime.mjs'
      - 'src/stoneage_map_runtime.mjs'
      - 'src/stoneage_world_map_repair_overlay.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'data/generated/stoneage_first_idle_route_catalog.json'
      - 'data/generated/stoneage_start_destination_warp_coordinates.json'
      - 'data/generated/stoneage_start_encounter_target_index.json'
      - 'data/generated/stoneage_map_100.json'
      - 'data/generated/stoneage_map_1000.json'
      - 'data/generated/stoneage_map_200.json'
      - 'data/generated/stoneage_map_4000.json'
      - 'data/generated/stoneage_mapset_runtime.json'
      - 'data/generated/stoneage_browser_world_first_route_schema.json'
      - 'tools/check_v378_browser_world_first_route.mjs'
      - 'docs/reference/v378-browser-world-first-route.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v378-browser-world-first-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Run V3.78 Browser World First-Route regression
        run: node tools/check_v378_browser_world_first_route.mjs fixed-c-source
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_world_first_route_runtime.mjs
          node --check tools/check_v378_browser_world_first_route.mjs
