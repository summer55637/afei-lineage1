name: V3.10 GMQUE reward Enemy template runtime

on:
  push:
    paths:
      - 'game.js'
      - 'data/generated/stoneage_gmque_reward_enemy_templates.json'
      - 'tools/check_v310_gmque_reward_enemy_template_runtime.mjs'
      - '.github/workflows/v310-gmque-reward-enemy-template-runtime.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'data/generated/stoneage_gmque_reward_enemy_templates.json'
      - 'tools/check_v310_gmque_reward_enemy_template_runtime.mjs'
      - '.github/workflows/v310-gmque-reward-enemy-template-runtime.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V3.10 GMQUE reward Enemy template runtime audit
        run: node tools/check_v310_gmque_reward_enemy_template_runtime.mjs
