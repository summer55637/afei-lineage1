name: Verify fixed-C first-route maps

on:
  push:
    paths:
      - '.github/workflows/verify-first-route-maps.yml'
      - 'tools/generate_verified_map_runtime.mjs'
      - 'tools/stoneage_ls2map_parser.mjs'
      - 'src/stoneage_map_runtime.mjs'

permissions:
  contents: write

jobs:
  verify-first-route-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: /tmp/StoneAge
          fetch-depth: 1

      - name: Verify source identities
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/StoneAge/gmsv/data/map/sainasu/sainasu
          test -f /tmp/StoneAge/gmsv/data/map/jyaruga/jalga
          sha1sum /tmp/StoneAge/gmsv/data/map/sainasu/sainasu
          sha1sum /tmp/StoneAge/gmsv/data/map/jyaruga/jalga
          test "$(git -C /tmp/StoneAge rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"

      - name: Generate verified map runtimes
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate_verified_map_runtime.mjs --floor 100 --source-path gmsv/data/map/sainasu/sainasu --source-root /tmp/StoneAge --out data/generated/stoneage_map_100.json
          node tools/generate_verified_map_runtime.mjs --floor 200 --source-path gmsv/data/map/jyaruga/jalga --source-root /tmp/StoneAge --out data/generated/stoneage_map_200.json

      - name: Run first-route checks
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit_start_world_exit_reachability.mjs
          test -f data/generated/stoneage_start_encounter_target_index.json

      - name: Commit verified runtimes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_map_100.json data/generated/stoneage_map_200.json data/generated/stoneage_map_runtime_index.json data/generated/stoneage_start_world_exit_reachability.json
          if git diff --cached --quiet; then
            echo 'No runtime changes.'
            exit 0
          fi
          git commit -m 'data: verify fixed-C first-route maps'
          git push
