name: Check V4.32 Browser Battle Enemy AI Attack Pipeline
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_plan_runtime.mjs'
      - 'src/stoneage_browser_battle_critical_damage_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_react_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_death_chain_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_commit_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs'
      - '.github/workflows/check-v432-browser-battle-enemy-ai-attack-pipeline.yml'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_plan_runtime.mjs'
      - 'src/stoneage_browser_battle_critical_damage_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_react_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_death_chain_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_commit_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run enemy AI and battle pipeline regressions
        run: |
          node tools/check_v429_browser_battle_enemy_ai_target_types.mjs
          node tools/check_v430_browser_battle_enemy_ai_target_selection.mjs
          node tools/check_v431_browser_battle_enemy_ai_controller.mjs
          node tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs
          node tools/check_browser_battle_attack_pipeline_binding.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_enemy_ai_runtime.mjs
          node --check src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs
          node --check src/stoneage_browser_battle_damage_plan_runtime.mjs
          node --check src/stoneage_browser_battle_critical_damage_runtime.mjs
          node --check src/stoneage_browser_battle_damage_react_runtime.mjs
          node --check src/stoneage_browser_battle_damage_death_chain_runtime.mjs
          node --check src/stoneage_browser_battle_damage_commit_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs
