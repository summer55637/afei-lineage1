name: V2.86 PetSkill source closure audit

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'README.md'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'data/generated/stoneage_enemy_ai.json'
      - 'tools/check_v286_source_closure_audit.mjs'
      - '.github/workflows/v286-source-closure.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.86 source closure audit
        run: node tools/check_v286_source_closure_audit.mjs
