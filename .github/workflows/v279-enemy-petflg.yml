name: V2.79 Enemy PETFLG source parity regression

on:
  push:
    paths:
      - 'game.js'
      - 'start.html'
      - 'data/generated/stoneage_general_encounter_runtime.json'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'tools/check_v279_enemy_petflg_source_parity.mjs'
      - '.github/workflows/v279-enemy-petflg.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp start.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.79 Enemy PETFLG source parity regression
        run: node tools/check_v279_enemy_petflg_source_parity.mjs
