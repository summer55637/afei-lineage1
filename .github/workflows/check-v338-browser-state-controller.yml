name: Check V3.38 browser state controller

on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_npc_runtime_config.mjs'
      - 'src/stoneage_npc_dispatch_runtime.mjs'
      - 'src/stoneage_first_route_save.mjs'
      - 'src/stoneage_first_route_reward_handlers.mjs'
      - 'src/stoneage_npc_module_registry_runtime.mjs'
      - 'src/stoneage_npc_interaction_runtime.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'tools/check_v338_browser_state_controller.mjs'
      - 'data/generated/stoneage_start_npc_reachability.json'
      - 'data/generated/stoneage_new_player_event_closure.json'
      - 'data/generated/stoneage_world_npc_functionset_audit.json'
      - 'data/generated/stoneage_changeevent_compatibility_reference.json'
      - 'data/generated/stoneage_new_player_item_reward_runtime.json'
      - 'data/generated/stoneage_item_make_runtime.json'
      - 'data/generated/stoneage_new_player_pet_runtime.json'
      - '.github/workflows/check-v338-browser-state-controller.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_npc_runtime_config.mjs
          node --check src/stoneage_npc_dispatch_runtime.mjs
          node --check tools/check_v338_browser_state_controller.mjs
      - name: Run V3.38 regression
        run: node tools/check_v338_browser_state_controller.mjs
