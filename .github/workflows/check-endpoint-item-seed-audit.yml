name: Check endpoint item seed audit

on:
  workflow_run:
    workflows:
      - Maintain README status
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-item-seed-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check committed endpoint Item seed audit
        run: node tools/check_endpoint_item_seed_audit.mjs --check

      - name: Inspect deployed server binary linkage
        shell: bash
        run: |
          set -euo pipefail
          file ro0000/server/merged-source/gmsv/gmsvjt
          readelf -Ws ro0000/server/merged-source/gmsv/gmsvjt | grep -E 'ITEM_readItemConfFile|ITEM_makeItem|ITEM_makeItemAndRegist|ITEM_tblen|ITEM_idxlen|ITEM_idx|ITEM_tbl|ITEM_TransformList|ITEM_getSIndexFromTransList' | head -n 160 || true
          strings -a ro0000/server/merged-source/gmsv/gmsvjt | grep -E 'ITEM1|itemset6\.csv|itemset6file|ITEM_makeItem|ITEM_readItem|ITEM_tblen|ITEM_idxlen' | head -n 160 || true

      - name: Run endpoint source catalog invariants
        run: node tools/check_endpoint_source_catalog.mjs
