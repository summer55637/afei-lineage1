name: Maintain README status

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain-readme-main
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone pinned fixed-C source for endpoint audits
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Refresh source catalogs and README safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "README/data refresh attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            # Regenerate the endpoint evidence that the README reports.
            node tools/generate_endpoint_source_catalog.mjs
            node tools/generate_endpoint_completeness_audit.mjs --write
            node tools/check_endpoint_item_seed_audit.mjs --write
            node tools/check_endpoint_mapwarp_audit.mjs --write
            node tools/check_endpoint_battle_data_source_audit.mjs --write
            node tools/check_endpoint_gmque_source_locator.mjs --write

            node tools/generate_readme.mjs

            git add README.md               data/generated/stoneage_endpoint_source_catalog.json               data/generated/stoneage_endpoint_completeness_audit.json               data/generated/stoneage_endpoint_item_seed_audit.json               data/generated/stoneage_endpoint_mapwarp_audit.json               data/generated/stoneage_endpoint_battle_data_source_audit.json               data/generated/stoneage_endpoint_gmque_source_locator.json

            if git diff --cached --quiet; then
              echo "README and source evidence are already up to date."
              exit 0
            fi

            git commit -m "[docs] auto-update README and endpoint evidence"

            if git push origin HEAD:main; then
              echo "README and endpoint evidence update pushed."
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest origin/main."
          done

          echo "README/data update could not be pushed after 3 attempts."
          exit 1
