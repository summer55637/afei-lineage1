name: Maintain README status

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain-readme-main
  cancel-in-progress: true

jobs:
  update-readme:
    # The workflow intentionally commits both README.md and generated endpoint
    # evidence. Ignore that bot-generated follow-up push, otherwise the generated
    # "latest commit" field would point at the previous bot commit and create an
    # endless self-refresh loop.
    if: ${{ github.event_name == 'workflow_dispatch' || !(github.event_name == 'push' && github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, '[docs] auto-update README and endpoint evidence')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clone pinned fixed-C source for endpoint audits
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Refresh source catalogs and README safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "README/data refresh attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            # Regenerate the endpoint evidence that the README reports.
            node tools/generate_endpoint_source_catalog.mjs
            node tools/generate_endpoint_completeness_audit.mjs --write
            node tools/check_endpoint_item_seed_audit.mjs --write
            node tools/check_endpoint_mapwarp_audit.mjs --write
            node tools/check_endpoint_battle_data_source_audit.mjs --write
            node tools/generate_endpoint_start_encounter_group_closure.mjs
            node tools/check_endpoint_gmque_source_locator.mjs --write
            node tools/audit_endpoint_world_blockers.mjs --write
            node tools/rebind_ro0000_snapshot_audits.mjs
            node tools/audit_ro0000_battlemap_selector.mjs
            node tools/test_sabex_decoder.mjs
            node tools/test_sabex_client_image_runtime.mjs
            python3 tools/test_ro0000_adrn_decoder.py
            node tools/check_v317_rd_decoder.mjs

            node tools/generate_readme.mjs

            git add README.md \
              data/generated/stoneage_endpoint_source_catalog.json \
              data/generated/stoneage_endpoint_completeness_audit.json \
              data/generated/stoneage_endpoint_item_seed_audit.json \
              data/generated/stoneage_endpoint_mapwarp_audit.json \
              data/generated/stoneage_endpoint_battle_data_source_audit.json \
              data/generated/stoneage_endpoint_start_encounter_group_closure.json \
              data/generated/stoneage_endpoint_gmque_source_locator.json \
              data/generated/stoneage_endpoint_world_blocker_audit.json \
              data/generated/stoneage_ro0000_dependency_triage.json \
              data/generated/stoneage_ro0000_hecheng_loader_audit.json \
              data/generated/stoneage_ro0000_isolated_residue_audit.json \
              data/generated/stoneage_ro0000_residue_inventory.json \
              data/generated/stoneage_ro0000_residue_structure_audit.json \
              data/generated/stoneage_ro0000_battlemap_selector_audit.json
              data/generated/stoneage_ro0000_android_adrn_crypto_contract.json \
              data/generated/stoneage_ro0000_android_native_resource_layout.json \
              data/generated/stoneage_ro0000_android_rd_decoder_contract.json
              data/generated/stoneage_ro0000_android_battle_render_chain.json

            if git diff --cached --quiet; then
              echo "README and source evidence are already up to date."
              exit 0
            fi

            git commit -m "[docs] auto-update README and endpoint evidence"

            if git push origin HEAD:main; then
              echo "README and source evidence update pushed."
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest origin/main."
          done

          echo "README/data update could not be pushed after 3 attempts."
          exit 1
