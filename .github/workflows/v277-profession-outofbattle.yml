name: V2.77 profession out-of-battle regression

on:
  push:
    paths:
      - 'game.js'
      - 'start.html'
      - 'data/generated/stoneage_profession_skill_runtime.json'
      - 'tools/check_v277_profession_outofbattle_runtime.mjs'
      - '.github/workflows/v277-profession-outofbattle.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp start.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.77 out-of-battle profession regression
        run: node tools/check_v277_profession_outofbattle_runtime.mjs
