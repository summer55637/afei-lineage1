name: one-shot-item-event-closure-v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout fixed source
        run: |
          rm -rf /tmp/StoneAge
          git clone --quiet https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          cd /tmp/StoneAge
          git checkout --quiet 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          test "$(git rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
      - name: Regenerate item and event closure
        run: |
          node tools/generate_item_event_closure_index.mjs \
            --source-root /tmp/StoneAge \
            --out data/generated/stoneage_item_event_closure_index.json
      - name: Commit output and remove workflow
        run: |
          rm -f .github/workflows/one-shot-item-event-closure-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_item_event_closure_index.json \
                  tools/generate_item_event_closure_index.mjs \
                  .github/workflows/one-shot-item-event-closure-v2.yml
          git commit -m 'data: correct item and event closure semantics'
          git push origin HEAD:main
