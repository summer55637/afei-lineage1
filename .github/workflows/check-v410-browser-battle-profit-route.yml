name: Check V4.10 Browser Battle Profit Route
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_profit_route_runtime.mjs'
      - 'src/stoneage_browser_battle_finish_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_end_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v410_browser_battle_profit_route.mjs'
      - 'data/generated/stoneage_browser_battle_profit_route_schema.json'
      - 'docs/reference/v410-browser-battle-profit-route.md'
      - '.github/workflows/check-v410-browser-battle-profit-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V4.01 through V4.10 regressions
        run: |
          node tools/check_v401_browser_battle_attack_seq_prelude.mjs
          node tools/check_v402_browser_battle_damage_plan.mjs
          node tools/check_v403_browser_battle_critical_damage.mjs
          node tools/check_v404_browser_battle_damage_react.mjs
          node tools/check_v405_browser_battle_counter.mjs
          node tools/check_v406_browser_battle_death.mjs
          node tools/check_v407_browser_battle_death_commit.mjs
          node tools/check_v408_browser_battle_end.mjs
          node tools/check_v409_browser_battle_finish_commit.mjs
          node tools/check_v410_browser_battle_profit_route.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_profit_route_runtime.mjs
          node --check src/stoneage_browser_battle_finish_commit_runtime.mjs
          node --check src/stoneage_browser_battle_end_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v410_browser_battle_profit_route.mjs
