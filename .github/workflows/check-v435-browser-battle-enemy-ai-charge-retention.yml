name: Check V4.35 Browser Battle Enemy AI Charge Retention
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'tools/check_v435_browser_battle_enemy_ai_charge_retention.mjs'
      - '.github/workflows/check-v435-browser-battle-enemy-ai-charge-retention.yml'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'tools/check_v435_browser_battle_enemy_ai_charge_retention.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run enemy AI source lifecycle regressions
        run: |
          node tools/check_v429_browser_battle_enemy_ai_target_types.mjs
          node tools/check_v430_browser_battle_enemy_ai_target_selection.mjs
          node tools/check_v431_browser_battle_enemy_ai_controller.mjs
          node tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs
          node tools/check_v433_browser_battle_enemy_ai_dead_entry.mjs
          node tools/check_v434_browser_battle_enemy_ai_can_move.mjs
          node tools/check_v435_browser_battle_enemy_ai_charge_retention.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_enemy_ai_runtime.mjs
          node --check tools/check_v435_browser_battle_enemy_ai_charge_retention.mjs
