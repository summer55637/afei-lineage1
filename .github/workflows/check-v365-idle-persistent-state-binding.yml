name: Check V3.65 Idle Loop Persistent State binding

on:
  push:
    paths:
      - 'src/stoneage_idle_loop.mjs'
      - 'src/stoneage_idle_persistent_state_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'data/generated/stoneage_idle_loop_contract.json'
      - 'tools/check_idle_loop_contract.mjs'
      - 'tools/check_v365_idle_persistent_state_runtime.mjs'
      - 'docs/reference/v365-idle-persistent-state-binding.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v365-idle-persistent-state-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check Idle Loop contract
        run: node tools/check_idle_loop_contract.mjs
      - name: Check V3.65 Persistent State binding
        run: node tools/check_v365_idle_persistent_state_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_idle_loop.mjs
          node --check src/stoneage_idle_persistent_state_runtime.mjs
          node --check tools/check_idle_loop_contract.mjs
          node --check tools/check_v365_idle_persistent_state_runtime.mjs
