name: V3.17 client RD decoder

on:
  push:
    paths:
      - 'src/stoneage_rd_decoder.mjs'
      - 'tools/check_v317_rd_decoder.mjs'
      - 'docs/reference/v317-rd-decoder-contract.md'
      - '.github/workflows/v317-rd-decoder.yml'
  pull_request:
    paths:
      - 'src/stoneage_rd_decoder.mjs'
      - 'tools/check_v317_rd_decoder.mjs'
      - 'docs/reference/v317-rd-decoder-contract.md'
      - '.github/workflows/v317-rd-decoder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check RD decoder syntax
        run: node --check src/stoneage_rd_decoder.mjs
      - name: Run V3.17 RD decoder regression
        run: node tools/check_v317_rd_decoder.mjs