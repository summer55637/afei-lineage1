name: Check V4.18 Browser Battle Item Commit

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_item_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_item_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/check_v418_browser_battle_item_commit.mjs'
      - 'data/generated/stoneage_browser_battle_item_commit_schema.json'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_item_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_item_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/check_v418_browser_battle_item_commit.mjs'
      - 'data/generated/stoneage_browser_battle_item_commit_schema.json'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_v418_browser_battle_item_commit.mjs
