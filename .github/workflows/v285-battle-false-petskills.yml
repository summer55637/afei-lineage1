name: V2.85 battle-incompatible PetSkills regression

on:
  push:
    paths:
      - 'game.js'
      - 'index.html'
      - 'README.md'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'data/generated/stoneage_enemy_ai.json'
      - 'tools/check_v285_battle_false_petskills.mjs'
      - '.github/workflows/v285-battle-false-petskills.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp index.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.85 battle-false PetSkill regression
        run: node tools/check_v285_battle_false_petskills.mjs
