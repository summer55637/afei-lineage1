name: V3.10 world HUD

on:
  push:
    paths:
      - 'game.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v310_world_hud.mjs'
      - '.github/workflows/v310-world-hud.yml'
  pull_request:
    paths:
      - 'game.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v310_world_hud.mjs'
      - '.github/workflows/v310-world-hud.yml'
  workflow_dispatch:

jobs:
  world-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check game.js
      - run: node tools/check_v310_world_hud.mjs
