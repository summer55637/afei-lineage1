name: Check V3.44 Persistent State save join

on:
  push:
    paths:
      - 'tools/check_v344_persistent_state_save_join.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'src/stoneage_item_economy_runtime.mjs'
      - 'data/generated/stoneage_persistent_state_schema.json'
      - 'data/generated/stoneage_save_envelope_schema.json'
      - 'data/generated/stoneage_item_economy_runtime_schema.json'
      - '.github/workflows/check-v344-persistent-state-save-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.44 Persistent State save join
        run: node tools/check_v344_persistent_state_save_join.mjs
