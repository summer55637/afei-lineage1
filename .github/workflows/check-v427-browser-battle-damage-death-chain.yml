name: Check V4.27 Browser Battle Damage Death Chain
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_damage_death_chain_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_death_runtime.mjs'
      - 'src/stoneage_browser_battle_death_commit_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v427_browser_battle_damage_death_chain.mjs'
      - '.github/workflows/check-v427-browser-battle-damage-death-chain.yml'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_damage_death_chain_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_death_runtime.mjs'
      - 'src/stoneage_browser_battle_death_commit_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v427_browser_battle_damage_death_chain.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run battle damage and death regressions
        run: |
          node tools/check_v426_browser_battle_damage_commit.mjs
          node tools/check_v407_browser_battle_death_commit.mjs
          node tools/check_v427_browser_battle_damage_death_chain.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_damage_death_chain_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v427_browser_battle_damage_death_chain.mjs
