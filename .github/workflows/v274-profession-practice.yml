name: V2.74 profession practice regression

on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'game.html'
      - 'data/generated/stoneage_profession_skill_runtime.json'
      - 'tools/check_v274_profession_magic_practice_runtime.mjs'
      - '.github/workflows/v274-profession-practice.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V2.74 regression
        run: node tools/check_v274_profession_magic_practice_runtime.mjs
