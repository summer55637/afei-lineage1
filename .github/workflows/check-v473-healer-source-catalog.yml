name: check-v473-healer-source-catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_healer_source_catalog.mjs'
      - 'tools/check_v473_healer_source_catalog.mjs'
      - 'tools/fixtures/npc-healer/world-index.json'
      - '.github/workflows/check-v473-healer-source-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  healer-source-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Clone pinned fixed-C source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Run V4.73 Healer source catalog regression
        run: node tools/check_v473_healer_source_catalog.mjs

      - name: Generate fixed-C World NPC index in temp workspace
        run: |
          node tools/generate_world_data_catalog.mjs             --source-root fixed-c-source             --out-dir /tmp/v473-world

      - name: Generate production Healer source catalog
        run: |
          node tools/generate_healer_source_catalog.mjs             --world-index /tmp/v473-world/stoneage_world_npc_index.json             --out data/generated/stoneage_healer_source_catalog.json

      - name: Re-run V4.73 regression against generated catalog
        run: node tools/check_v473_healer_source_catalog.mjs

      - name: Syntax check
        run: |
          node --check tools/generate_healer_source_catalog.mjs
          node --check tools/check_v473_healer_source_catalog.mjs

      - name: Commit generated Healer catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/stoneage_healer_source_catalog.json
          if git diff --cached --quiet; then
            echo "Healer source catalog already current."
            exit 0
          fi
          git commit -m "[docs] auto-update V4.73 Healer source catalog"
          git push origin HEAD:main
