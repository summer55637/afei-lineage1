name: V3.10 GMQUE trophy runtime regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gmque-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check game.js
      - run: node tools/check_v310_gmque_trophy_runtime.mjs
