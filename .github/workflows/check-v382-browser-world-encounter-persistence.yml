name: Check V3.82 Browser World Encounter persistence
on:
  push:
    paths:
      - 'src/stoneage_persistent_state.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_encounter_runtime.mjs'
      - 'src/stoneage_browser_world_encounter_persistence_runtime.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'data/generated/stoneage_start_encounter_target_index.json'
      - 'data/generated/stoneage_browser_world_encounter_persistence_schema.json'
      - 'tools/check_v380_browser_world_encounter_runtime.mjs'
      - 'tools/check_v381_browser_world_encounter_roll_runtime.mjs'
      - 'tools/check_v382_browser_world_encounter_persistence.mjs'
      - 'docs/reference/v382-browser-world-encounter-persistence.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v382-browser-world-encounter-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Verify fixed-C network source
        run: |
          test "$(git -C fixed-c-source hash-object gmsv/src/net.c)" = "91b7911e48b9fc8e76eec9cc400efebbd7b1ef48"
      - name: Run V3.80 V3.81 V3.82 encounter regression
        run: |
          node tools/check_v380_browser_world_encounter_runtime.mjs fixed-c-source
          node tools/check_v381_browser_world_encounter_roll_runtime.mjs fixed-c-source
          node tools/check_v382_browser_world_encounter_persistence.mjs fixed-c-source
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_persistent_state.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_world_encounter_runtime.mjs
          node --check src/stoneage_browser_world_encounter_persistence_runtime.mjs
          node --check tools/check_v382_browser_world_encounter_persistence.mjs
