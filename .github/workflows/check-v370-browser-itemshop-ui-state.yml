name: Check V3.70 Browser ItemShop UI state
on:
  push:
    paths:
      - 'src/stoneage_browser_itemshop_ui_state.mjs'
      - 'src/stoneage_browser_itemshop_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_item_economy_runtime.mjs'
      - 'tools/check_v370_browser_itemshop_ui_state.mjs'
      - 'docs/reference/v370-browser-itemshop-ui-state.md'
      - 'data/generated/stoneage_itemshop_ui_state_schema.json'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v370-browser-itemshop-ui-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.70 regression
        run: node tools/check_v370_browser_itemshop_ui_state.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_itemshop_ui_state.mjs
          node --check src/stoneage_browser_itemshop_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v370_browser_itemshop_ui_state.mjs
