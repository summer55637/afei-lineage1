name: Check V3.58 browser SavePoint runtime

on:
  push:
    paths:
      - 'src/stoneage_browser_savepoint_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_npc_runtime.mjs'
      - 'src/stoneage_npc_interaction_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/generate_savepoint_source_catalog.mjs'
      - 'tools/fixtures/npc-savepoint/savepoint-catalog.json'
      - 'tools/check_v358_browser_savepoint_runtime.mjs'
      - 'docs/reference/v358-browser-savepoint-runtime.md'
      - '.github/workflows/check-v358-browser-savepoint-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Generate SavePoint source catalog
        run: node tools/generate_savepoint_source_catalog.mjs --source-root fixed-c-source --out data/generated/stoneage_npc_savepoint_source_index.json
      - name: Run V3.58 browser SavePoint regression
        run: node tools/check_v358_browser_savepoint_runtime.mjs
      - name: Check fixed-C SavePoint source contract
        run: |
          grep -q '#define RANGE 2' fixed-c-source/gmsv/src/npc/npc_savepoint.c
          grep -q 'CHAR_LASTTALKELDER' fixed-c-source/gmsv/src/npc/npc_savepoint.c
          grep -q 'NPC_UsedCheck' fixed-c-source/gmsv/src/npc/npc_savepoint.c
      - name: Upload generated SavePoint source catalog
        uses: actions/upload-artifact@v4
        with:
          name: v358-savepoint-source-catalog
          path: data/generated/stoneage_npc_savepoint_source_index.json
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_savepoint_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/generate_savepoint_source_catalog.mjs
          node --check tools/check_v358_browser_savepoint_runtime.mjs

