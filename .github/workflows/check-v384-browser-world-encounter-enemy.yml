name: Check V3.84 Browser World Encounter Enemy generation
on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_encounter_enemy_runtime.mjs'
      - 'src/stoneage_browser_world_encounter_group_runtime.mjs'
      - 'src/stoneage_browser_world_encounter_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_start_encounter_target_index.json'
      - 'data/generated/stoneage_start_encounter_group_runtime.json'
      - 'data/generated/stoneage_browser_world_encounter_enemy_schema.json'
      - 'tools/generate_start_encounter_group_runtime.mjs'
      - 'tools/check_v384_browser_world_encounter_enemy_runtime.mjs'
      - 'docs/reference/v384-browser-world-encounter-enemy.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v384-browser-world-encounter-enemy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Verify fixed-C Group, Enemy, EnemyBase sources
        run: |
          test "$(git -C fixed-c-source hash-object gmsv/data/group1.txt)" = "1be75eb3e56ab16d4b433146ec59538ad651c874"
          test "$(git -C fixed-c-source hash-object gmsv/data/enemy1.txt)" = "bf245a391adeace09915b6e425754b54ab69a8f6"
          test "$(git -C fixed-c-source hash-object gmsv/data/enemybase1.txt)" = "a19a508975e3a982fada323861b35b2edab79349"
      - name: Run encounter regressions
        run: |
          node tools/check_v380_browser_world_encounter_runtime.mjs fixed-c-source
          node tools/check_v381_browser_world_encounter_roll_runtime.mjs fixed-c-source
          node tools/check_v382_browser_world_encounter_persistence.mjs fixed-c-source
          node tools/check_v383_browser_world_encounter_group_runtime.mjs fixed-c-source
          node tools/check_v384_browser_world_encounter_enemy_runtime.mjs fixed-c-source
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_world_encounter_runtime.mjs
          node --check src/stoneage_browser_world_encounter_persistence_runtime.mjs
          node --check src/stoneage_browser_world_encounter_group_runtime.mjs
          node --check src/stoneage_browser_world_encounter_enemy_runtime.mjs
          node --check tools/generate_start_encounter_group_runtime.mjs
          node --check tools/check_v384_browser_world_encounter_enemy_runtime.mjs
