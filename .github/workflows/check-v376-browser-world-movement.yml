name: Check V3.76 Browser World Movement Step
on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_movement_runtime.mjs'
      - 'src/stoneage_map_runtime.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_map_1000.json'
      - 'data/generated/stoneage_mapset_runtime.json'
      - 'data/generated/stoneage_browser_world_movement_schema.json'
      - 'tools/check_v376_browser_world_movement.mjs'
      - 'docs/reference/v376-browser-world-movement.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v376-browser-world-movement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Run V3.76 Browser World Movement regression
        run: node tools/check_v376_browser_world_movement.mjs fixed-c-source
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_world_movement_runtime.mjs
          node --check tools/check_v376_browser_world_movement.mjs
