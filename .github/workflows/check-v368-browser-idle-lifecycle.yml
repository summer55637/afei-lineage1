name: Check V3.68 Browser Idle lifecycle and offline checkpoint
on:
  push:
    paths:
      - 'src/stoneage_browser_idle_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_offline_resume.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'tools/check_v368_browser_idle_lifecycle.mjs'
      - 'docs/reference/v368-browser-idle-lifecycle-offline-checkpoint.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v368-browser-idle-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.68 regression
        run: node tools/check_v368_browser_idle_lifecycle.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_idle_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v368_browser_idle_lifecycle.mjs
