name: Check endpoint setup config audit

on:
  push:
    branches:
      - main
    paths:
      - 'ro0000/server/merged-source/gmsv/setup.cf'
      - 'data/generated/stoneage_endpoint_setup_config_audit.json'
      - 'tools/check_endpoint_setup_config_audit.mjs'
      - 'docs/reference/endpoint-setup-config-audit.md'
      - '.github/workflows/check-endpoint-setup-config-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-setup-config-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone pinned fixed-C source
        id: fixed
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          echo "sha=$(git -C fixed-c-source rev-parse HEAD:gmsv/setup.cf)" >> "$GITHUB_OUTPUT"

      - name: Check endpoint setup audit
        env:
          FIXED_SETUP_BLOB_SHA: ${{ steps.fixed.outputs.sha }}
        run: node tools/check_endpoint_setup_config_audit.mjs --check