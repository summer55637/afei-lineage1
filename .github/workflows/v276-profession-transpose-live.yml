name: V2.76 profession transpose live regression

on:
  push:
    paths:
      - "game.js"
      - "start.html"
      - "tools/check_v276_profession_transpose_live.mjs"
      - "tools/profession_transpose_runtime.mjs"
      - "data/generated/stoneage_profession_skill_runtime.json"
      - ".github/workflows/v276-profession-transpose-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp start.html game.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check game.js syntax
        run: node --check game.js

      - name: Run V2.76 Skill 21 live regression
        run: node tools/check_v276_profession_transpose_live.mjs
