name: Check V4.38 Browser Enemy NoGuard
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'src/stoneage_browser_battle_turn_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_battle_counter_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'tools/check_v438_browser_battle_enemy_noguard.mjs'
      - '.github/workflows/check-v438-browser-enemy-noguard.yml'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_enemy_ai_runtime.mjs'
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'src/stoneage_browser_battle_turn_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_battle_counter_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_petskill_runtime.json'
      - 'tools/check_v438_browser_battle_enemy_noguard.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run NoGuard and battle regressions
        run: |
          node tools/check_v429_browser_battle_enemy_ai_target_types.mjs
          node tools/check_v430_browser_battle_enemy_ai_target_selection.mjs
          node tools/check_v431_browser_battle_enemy_ai_controller.mjs
          node tools/check_v432_browser_battle_enemy_ai_attack_pipeline.mjs
          node tools/check_v433_browser_battle_enemy_ai_dead_entry.mjs
          node tools/check_v434_browser_battle_enemy_ai_can_move.mjs
          node tools/check_v435_browser_battle_enemy_ai_charge_retention.mjs
          node tools/check_v436_browser_battle_enemy_ai_target_parity.mjs
          node tools/check_v437_browser_battle_enemy_ai_waza_lifecycle.mjs
          node tools/check_v438_browser_battle_enemy_noguard.mjs
          node tools/check_v386_browser_battle_context_runtime.mjs
          node tools/check_v405_browser_battle_counter.mjs
          node tools/check_browser_battle_attack_pipeline_binding.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_enemy_ai_runtime.mjs
          node --check src/stoneage_browser_battle_context_runtime.mjs
          node --check src/stoneage_browser_battle_turn_runtime.mjs
          node --check src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs
          node --check src/stoneage_browser_battle_counter_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v438_browser_battle_enemy_noguard.mjs
