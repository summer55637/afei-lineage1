name: Check Browser Battle Finish Hook Profile

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'src/stoneage_browser_battle_finish_commit_runtime.mjs'
      - 'data/generated/stoneage_battle_finish_hook_audit.json'
      - 'data/generated/stoneage_browser_battle_finish_hook_profile_schema.json'
      - 'tools/check_v409_browser_battle_finish_commit.mjs'
      - 'tools/check_browser_battle_finish_hook_profile.mjs'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'src/stoneage_browser_battle_finish_commit_runtime.mjs'
      - 'data/generated/stoneage_battle_finish_hook_audit.json'
      - 'data/generated/stoneage_browser_battle_finish_hook_profile_schema.json'
      - 'tools/check_v409_browser_battle_finish_commit.mjs'
      - 'tools/check_browser_battle_finish_hook_profile.mjs'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/check_browser_battle_finish_hook_profile.mjs
      - run: node tools/check_v409_browser_battle_finish_commit.mjs
