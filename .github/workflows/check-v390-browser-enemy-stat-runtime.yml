name: Check V3.90 Browser Enemy Stat Runtime
on:
  push:
    paths:
      - 'src/stoneage_browser_enemy_stat_runtime.mjs'
      - 'src/stoneage_browser_world_encounter_enemy_runtime.mjs'
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'data/generated/stoneage_start_encounter_group_runtime.json'
      - 'data/generated/stoneage_browser_enemy_stat_schema.json'
      - 'tools/check_v390_browser_enemy_stat_runtime.mjs'
      - 'docs/reference/v390-browser-enemy-stat-runtime.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v390-browser-enemy-stat-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.90 Enemy stat regression
        run: node tools/check_v390_browser_enemy_stat_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_enemy_stat_runtime.mjs
          node --check src/stoneage_browser_world_encounter_enemy_runtime.mjs
          node --check src/stoneage_browser_battle_context_runtime.mjs
          node --check tools/check_v390_browser_enemy_stat_runtime.mjs
