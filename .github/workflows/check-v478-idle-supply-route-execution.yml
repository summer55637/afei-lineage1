name: check-v478-idle-supply-route-execution

on:
  push:
    branches: [main]
    paths:
      - 'src/stoneage_browser_idle_supply_route_runtime.mjs'
      - 'src/stoneage_browser_idle_supply_route_execution_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_movement_runtime.mjs'
      - 'src/stoneage_browser_world_warppoint_runtime.mjs'
      - 'src/stoneage_browser_window_healer_runtime.mjs'
      - 'tools/check_v478_idle_supply_route_execution.mjs'
      - 'data/generated/stoneage_idle_supply_warp_catalog.json'
      - 'data/generated/stoneage_recovery_service_source_catalog.json'
      - '.github/workflows/check-v478-idle-supply-route-execution.yml'
  workflow_dispatch:

jobs:
  idle-supply-route-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V4.78 idle supply route execution regression
        run: node tools/check_v478_idle_supply_route_execution.mjs
      - name: Syntax check
        run: |
          node --check src/stoneage_browser_idle_supply_route_runtime.mjs
          node --check src/stoneage_browser_idle_supply_route_execution_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_window_healer_runtime.mjs
          node --check tools/check_v478_idle_supply_route_execution.mjs
