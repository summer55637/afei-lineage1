name: Check V3.81 Browser World Encounter roll
on:
  push:
    paths:
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_encounter_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_start_encounter_target_index.json'
      - 'data/generated/stoneage_browser_world_encounter_schema.json'
      - 'data/generated/stoneage_browser_world_encounter_roll_schema.json'
      - 'tools/check_v380_browser_world_encounter_runtime.mjs'
      - 'tools/check_v381_browser_world_encounter_roll_runtime.mjs'
      - 'docs/reference/v380-browser-world-encounter-boundary.md'
      - 'docs/reference/v381-browser-world-encounter-roll.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v381-browser-world-encounter-roll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Verify fixed-C encounter source
        run: |
          test "$(git -C fixed-c-source hash-object gmsv/data/encount.txt)" = "89da97a15ea866a36f26ec3bb7ab5490f3eccc5f"
          test "$(git -C fixed-c-source hash-object gmsv/data/group1.txt)" = "1be75eb3e56ab16d4b433146ec59538ad651c874"
      - name: Run V3.80 and V3.81 encounter regression
        run: |
          node tools/check_v380_browser_world_encounter_runtime.mjs fixed-c-source
          node tools/check_v381_browser_world_encounter_roll_runtime.mjs fixed-c-source
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_world_encounter_runtime.mjs
          node --check tools/check_v380_browser_world_encounter_runtime.mjs
          node --check tools/check_v381_browser_world_encounter_roll_runtime.mjs
