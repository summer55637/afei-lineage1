name: Check V3.46 player creation runtime

on:
  push:
    paths:
      - 'src/stoneage_player_creation_runtime.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'tools/check_v346_player_creation_runtime.mjs'
      - 'data/generated/stoneage_persistent_state_schema.json'
      - 'data/generated/stoneage_new_player_seed_runtime.json'
      - '.github/workflows/check-v346-player-creation-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_player_creation_runtime.mjs
          node --check src/stoneage_persistent_state.mjs
          node --check tools/check_v346_player_creation_runtime.mjs
      - name: Run V3.46 player creation regression
        run: node tools/check_v346_player_creation_runtime.mjs