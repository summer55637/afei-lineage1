name: one-shot-item-reward-gap-clusters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reward gap clusters
        run: node tools/generate_item_reward_gap_clusters.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-item-reward-gap-clusters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_item_reward_gap_clusters.json tools/generate_item_reward_gap_clusters.mjs .github/workflows/one-shot-item-reward-gap-clusters.yml
          git commit -m 'data: add item reward gap clusters'
          git push origin HEAD:main