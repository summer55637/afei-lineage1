name: one-shot-world-catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout afei-lineage1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fixed StoneAge source
        shell: bash
        run: |
          rm -rf /tmp/StoneAge
          git clone --quiet https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          cd /tmp/StoneAge
          git checkout --quiet 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          test "$(git rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"

      - name: Generate world data indexes
        run: |
          node tools/generate_world_data_catalog.mjs --source-root /tmp/StoneAge --out-dir data/generated

      - name: Commit indexes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-world-catalog.yml
          git add data/generated/stoneage_world_npc_index.json \
                  data/generated/stoneage_server_config_index.json \
                  data/generated/stoneage_mapwarp_source_index.json \
                  tools/generate_world_data_catalog.mjs \
                  .github/workflows/one-shot-world-catalog.yml
          git diff --cached --quiet && exit 0
          git commit -m "data: generate fixed-source world NPC and warp indexes"
          git push origin HEAD:main
