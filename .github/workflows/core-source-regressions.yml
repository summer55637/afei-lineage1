name: Core source regressions (V2.88-V3.09)

on:
  push:
    paths:
      - 'game.js'
      - 'index.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/changelog/**'
      - 'data/generated/**'
      - 'tools/check_v288_damagereact_counter_boundary.mjs'
      - 'tools/check_v289_counter_guard_boundary.mjs'
      - 'tools/check_v290_attacker_damagereact_counter_boundary.mjs'
      - 'tools/check_v291_target_damagereact_preduck_boundary.mjs'
      - 'tools/check_v292_enemy_weapon_guardian_boundary.mjs'
      - 'tools/check_v293_damagereact_duckcheck_boundary.mjs'
      - 'tools/check_v294_duck_jyujyutu_kawashipara.mjs'
      - 'tools/check_v295_guardian_no_second_suit_dodge.mjs'
      - 'tools/check_v296_guardian_instigate_block.mjs'
      - 'tools/check_v297_acupuncture_wakeup_target.mjs'
      - 'tools/check_v298_first_dodge_guardian_boundary.mjs'
      - 'tools/check_v299_shared_first_dodge_suit_gate.mjs'
      - 'tools/check_v300_confusion_teamattack_rng.mjs'
      - 'tools/check_v301_original_damagereact_guardian_counter.mjs'
      - 'tools/check_v302_primary_acupuncture_wakeup_order.mjs'
      - 'tools/check_v303_guardian_acupuncture_wakeup_order.mjs'
      - 'tools/check_v304_enemy_player_guardian_acupuncture_wakeup.mjs'
      - 'tools/check_v305_caller_sensitive_acupuncture_wakeup.mjs'
      - 'tools/check_v306_gbreak_fallground_acupuncture_order.mjs'
      - 'tools/check_v307_toxin_weapon_acupuncture_order.mjs'
      - 'tools/check_v308_reaction_death_credit_itemcrush.mjs'
      - 'tools/check_v309_combo_death_credit_itemcrush.mjs'
      - '.github/workflows/core-source-regressions.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'index.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/changelog/**'
      - 'data/generated/**'
      - 'tools/check_v288_damagereact_counter_boundary.mjs'
      - 'tools/check_v289_counter_guard_boundary.mjs'
      - 'tools/check_v290_attacker_damagereact_counter_boundary.mjs'
      - 'tools/check_v291_target_damagereact_preduck_boundary.mjs'
      - 'tools/check_v292_enemy_weapon_guardian_boundary.mjs'
      - 'tools/check_v293_damagereact_duckcheck_boundary.mjs'
      - 'tools/check_v294_duck_jyujyutu_kawashipara.mjs'
      - 'tools/check_v295_guardian_no_second_suit_dodge.mjs'
      - 'tools/check_v296_guardian_instigate_block.mjs'
      - 'tools/check_v297_acupuncture_wakeup_target.mjs'
      - 'tools/check_v298_first_dodge_guardian_boundary.mjs'
      - 'tools/check_v299_shared_first_dodge_suit_gate.mjs'
      - 'tools/check_v300_confusion_teamattack_rng.mjs'
      - 'tools/check_v301_original_damagereact_guardian_counter.mjs'
      - 'tools/check_v302_primary_acupuncture_wakeup_order.mjs'
      - 'tools/check_v303_guardian_acupuncture_wakeup_order.mjs'
      - 'tools/check_v304_enemy_player_guardian_acupuncture_wakeup.mjs'
      - 'tools/check_v305_caller_sensitive_acupuncture_wakeup.mjs'
      - 'tools/check_v306_gbreak_fallground_acupuncture_order.mjs'
      - 'tools/check_v307_toxin_weapon_acupuncture_order.mjs'
      - 'tools/check_v308_reaction_death_credit_itemcrush.mjs'
      - 'tools/check_v309_combo_death_credit_itemcrush.mjs'
      - '.github/workflows/core-source-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp index.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js

  regression:
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - tools/check_v288_damagereact_counter_boundary.mjs
          - tools/check_v289_counter_guard_boundary.mjs
          - tools/check_v290_attacker_damagereact_counter_boundary.mjs
          - tools/check_v291_target_damagereact_preduck_boundary.mjs
          - tools/check_v292_enemy_weapon_guardian_boundary.mjs
          - tools/check_v293_damagereact_duckcheck_boundary.mjs
          - tools/check_v294_duck_jyujyutu_kawashipara.mjs
          - tools/check_v295_guardian_no_second_suit_dodge.mjs
          - tools/check_v296_guardian_instigate_block.mjs
          - tools/check_v297_acupuncture_wakeup_target.mjs
          - tools/check_v298_first_dodge_guardian_boundary.mjs
          - tools/check_v299_shared_first_dodge_suit_gate.mjs
          - tools/check_v300_confusion_teamattack_rng.mjs
          - tools/check_v301_original_damagereact_guardian_counter.mjs
          - tools/check_v302_primary_acupuncture_wakeup_order.mjs
          - tools/check_v303_guardian_acupuncture_wakeup_order.mjs
          - tools/check_v304_enemy_player_guardian_acupuncture_wakeup.mjs
          - tools/check_v305_caller_sensitive_acupuncture_wakeup.mjs
          - tools/check_v306_gbreak_fallground_acupuncture_order.mjs
          - tools/check_v307_toxin_weapon_acupuncture_order.mjs
          - tools/check_v308_reaction_death_credit_itemcrush.mjs
          - tools/check_v309_combo_death_credit_itemcrush.mjs
    steps:
      - uses: actions/checkout@v4
      - name: Provide regression HTML fixture
        run: cp index.html game.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source regression
        run: node "${{ matrix.script }}"
