name: GMQUE source contract

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'data/generated/stoneage_gmque_trophy_runtime.json'
      - 'tools/check_gmque_source_contract.mjs'
      - 'docs/reference/gmque-source-audit.md'
      - 'README.md'
      - '.github/workflows/gmque-source-contract.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run GMQUE source contract audit
        run: node tools/check_gmque_source_contract.mjs
      - name: Run V2.86 source closure audit
        run: node tools/check_v286_source_closure_audit.mjs
      - name: Run V3.09 Combo ItemCrush audit
        run: node tools/check_v309_combo_death_credit_itemcrush.mjs
