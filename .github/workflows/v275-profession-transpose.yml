name: V2.75 profession transpose regression

on:
  push:
    paths:
      - "tools/profession_transpose_runtime.mjs"
      - "tools/check_v275_profession_transpose_runtime.mjs"
      - "data/generated/stoneage_profession_skill_runtime.json"
      - ".github/workflows/v275-profession-transpose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check runtime module syntax
        run: node --check tools/profession_transpose_runtime.mjs

      - name: Run V2.75 Skill 21 regression
        run: node tools/check_v275_profession_transpose_runtime.mjs
