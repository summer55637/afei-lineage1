name: V3.10 encounter source closure

on:
  push:
    paths:
      - 'data/generated/stoneage_general_encounter_runtime.json'
      - 'data/generated/stoneage_general_encounter_source_closure.json'
      - 'game.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/reference/encounter-source-closure.md'
      - 'tools/check_v310_encounter_source_closure.mjs'
      - '.github/workflows/v310-encounter-source-closure.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run encounter source closure regression
        run: node tools/check_v310_encounter_source_closure.mjs
