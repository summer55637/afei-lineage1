name: V3.10 battle presentation

on:
  push:
    paths:
      - 'game.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v310_battle_presentation.mjs'
      - '.github/workflows/v310-battle-presentation.yml'
  pull_request:
    paths:
      - 'game.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v310_battle_presentation.mjs'
      - '.github/workflows/v310-battle-presentation.yml'
  workflow_dispatch:

jobs:
  battle-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run battle presentation regression
        run: node tools/check_v310_battle_presentation.mjs
