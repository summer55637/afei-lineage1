name: Check V3.52 starter Item 24114 exhaustive execution audit

on:
  push:
    paths:
      - 'data/generated/stoneage_starter_item_24114_source_audit.json'
      - 'data/generated/stoneage_item_make_runtime.json'
      - 'tools/check_v352_starter_item_24114_exhaustive_execution_audit.mjs'
      - 'docs/reference/v352-starter-item-24114-exhaustive-execution-audit.md'
      - '.github/workflows/check-v352-starter-item-24114-exhaustive-execution-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-item-exhaustive-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          git -C /tmp/StoneAge fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C /tmp/StoneAge checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
      - name: Verify loaded Item source set
        run: |
          test "$(find /tmp/StoneAge/gmsv/data -maxdepth 1 -type f -printf '%f\n' | grep -Ei '^itemset.*\\.(txt|bak)$' | sort | paste -sd ',' -)" = "itemset6.txt,itemset6.txt.bak"
          test "$(wc -c < /tmp/StoneAge/gmsv/data/itemset6.txt)" -eq 2777181
          grep -q '^ITEM1=24114$' /tmp/StoneAge/gmsv/setup.cf
          grep -q '^itemset6file=data/itemset6.txt$' /tmp/StoneAge/gmsv/setup.cf
          grep -q '#define _ITEMSET6_TXT' /tmp/StoneAge/gmsv/src/include/version.h
          ! grep -q '_IMPOROVE_ITEMTABLE' /tmp/StoneAge/gmsv/src/include/version.h
          grep -q '#define ITEM_ID_TOKEN_INDEX 17' /tmp/StoneAge/gmsv/src/item/item.c
          grep -q 'ITEM_readItemConfFile( getItemfile())' /tmp/StoneAge/gmsv/src/init.c
          grep -q 'ITEM_readItemConfFile( getItemfile())' /tmp/StoneAge/gmsv/src/char/chatmagic.c
          test "$(grep -F ',11817,24114,9900,16,' /tmp/StoneAge/gmsv/data/itemset6.txt | wc -l)" -eq 1
          if [ "$(cut -d',' -f17 /tmp/StoneAge/gmsv/data/itemset6.txt | grep -Fx '24114' | wc -l)" -ne 0 ]; then
            echo 'ERROR: pinned itemset6.txt contains source Item ID 24114 in token 17'
            exit 1
          fi
      - name: Run V3.52 regression
        run: node tools/check_v352_starter_item_24114_exhaustive_execution_audit.mjs
