name: Check V3.52 starter Item 24114 exhaustive execution audit

on:
  push:
    paths:
      - 'data/generated/stoneage_starter_item_24114_source_audit.json'
      - 'data/generated/stoneage_item_make_runtime.json'
      - 'tools/check_v352_starter_item_24114_exhaustive_execution_audit.mjs'
      - 'docs/reference/v352-starter-item-24114-exhaustive-execution-audit.md'
      - '.github/workflows/check-v352-starter-item-24114-exhaustive-execution-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-item-exhaustive-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1

      - name: Verify loaded Item source set
        run: |
          test "$(find fixed-c-source/gmsv/data -maxdepth 1 -type f -printf '%f\n' | grep -Ei '^itemset.*\.(txt|bak)$' | sort | paste -sd ',' -)" = "itemset6.txt,itemset6.txt.bak"
          test "$(wc -c < fixed-c-source/gmsv/data/itemset6.txt)" -eq 2777181
          grep -q '^ITEM1=24114$' fixed-c-source/gmsv/setup.cf
          grep -q '^itemset6file=data/itemset6.txt$' fixed-c-source/gmsv/setup.cf
          grep -q '#define _ITEMSET6_TXT' fixed-c-source/gmsv/src/include/version.h
          ! grep -q '_IMPOROVE_ITEMTABLE' fixed-c-source/gmsv/src/include/version.h
          grep -q '#define ITEM_ID_TOKEN_INDEX 17' fixed-c-source/gmsv/src/item/item.c
          grep -q 'ITEM_readItemConfFile( getItemfile())' fixed-c-source/gmsv/src/init.c
          grep -q 'ITEM_readItemConfFile( getItemfile())' fixed-c-source/gmsv/src/char/chatmagic.c
          test "$(git -C fixed-c-source hash-object gmsv/data/itemset6.txt)" = "eac985796b59286c547db2abce7b3d604a5e6226"

      - name: Verify 24114 is only an imageNumber
        run: |
          python3 - <<'PY'
from pathlib import Path
p=Path('fixed-c-source/gmsv/data/itemset6.txt')
lines=p.read_bytes().splitlines()
target=[]
configured=[]
for lineno,raw in enumerate(lines,1):
    tokens=raw.decode('latin1').split(',')
    if len(tokens) >= 20 and tokens[16].strip() == '11817':
        if tokens[17].strip() == '24114' and tokens[18].strip() == '9900' and tokens[19].strip() == '16':
            target.append((lineno,tokens[16].strip(),tokens[17].strip(),tokens[18].strip(),tokens[19].strip()))
    if len(tokens) >= 17 and tokens[16].strip() == '24114':
        configured.append(lineno)
assert len(target) == 1, target
assert target[0] == (3602,'11817','24114','9900','16'), target
assert configured == [], configured
print({'targetRow': target[0], 'configuredIdToken17Matches': len(configured)})

      - name: Run V3.52 regression
        run: node tools/check_v352_starter_item_24114_exhaustive_execution_audit.mjs
