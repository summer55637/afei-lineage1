      - "tools/check_v216_magic_defense_equip_callback.mjs"
      - "tools/check_v217_equip_resist_callback.mjs"
      - "tools/check_v218_suit_equip_callback.mjs"
      - "tools/check_v219_profession_magic_damage_core.mjs"
      - "tools/check_v220_profession_skill_runtime.mjs"
      - "tools/check_v221_profession_player_state.mjs"
      - "tools/check_v222_profession_proficiency_runtime.mjs"
      - "tools/check_v223_profession_live_physical_hooks.mjs"
      - "tools/check_v224_profession_command_outbattle.mjs"
      - "tools/check_v225_profession_battle_runtime.mjs"
      - "tools/check_v226_profession_chain_atk2_runtime.mjs"
      - "tools/check_v227_profession_shield_attack_runtime.mjs"
      - "tools/check_v228_profession_dead_attack_runtime.mjs"
      - "tools/check_v229_profession_through_attack_runtime.mjs"
      - "tools/check_v230_profession_convolute_runtime.mjs"
      - "tools/check_v231_profession_chaos_runtime.mjs"
      - "tools/check_v232_profession_warrior_assist_runtime.mjs"
      - "game.js"
      - "game.html"
      - "game.css"
      - ".github/workflows/generate-item-make-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate fixed runtime
        run: python tools/generate_item_make_runtime.py

      - name: Generate fixed field2 item runtime
        run: python tools/generate_item_field2_runtime.py

      - name: Generate fixed pet merge-fix runtime
        run: python tools/generate_pet_merge_fix_runtime.py

      - name: Generate fixed profession skill runtime
        run: python tools/generate_profession_skill_runtime.py

      - name: Check game.js syntax
        run: node --check game.js

      - name: Run V1.72 item make regressions
        run: node tools/check_v172_item_make_runtime.mjs

      - name: Run V1.73 item equip regressions
        run: node tools/check_v173_item_equip_runtime.mjs

      - name: Run V1.74 player ranged regressions
        run: node tools/check_v174_player_ranged_runtime.mjs

      - name: Run V1.75 player ranged confusion regressions
        run: node tools/check_v175_player_ranged_confusion_runtime.mjs

      - name: Run V1.76 player PetSkill regressions
        run: node tools/check_v176_player_petskill_runtime.mjs

      - name: Run V1.77 PETID Roar Vary regressions
        run: node tools/check_v177_petid_roar_vary_runtime.mjs

      - name: Run V1.78 player status PetSkill regressions
        run: node tools/check_v178_player_status_runtime.mjs

      - name: Run V1.79 player drain PetSkill regressions
        run: node tools/check_v179_player_drain_runtime.mjs

      - name: Run V1.80 player MP damage regressions
        run: node tools/check_v180_player_mpdamage_runtime.mjs

      - name: Run V1.81 player attribute attack regressions
        run: node tools/check_v181_player_attribute_attacks_runtime.mjs

      - name: Run V1.82 player Lighttakeed regressions
        run: node tools/check_v182_player_lighttakeed_runtime.mjs

      - name: Run V1.83 player SetDuck regressions
        run: node tools/check_v183_player_setduck_runtime.mjs

      - name: Run V1.84 SetMagicPet regressions
        run: node tools/check_v184_setmagicpet_runtime.mjs

      - name: Run V1.85 player Wild/Speedy/Sacrifice regressions
        run: node tools/check_v185_player_wild_speedy_sacrifice_runtime.mjs

      - name: Run V1.86 player Gyrate/Retrace regressions
        run: node tools/check_v186_player_gyrate_retrace_runtime.mjs

      - name: Run V1.87 player Hector/Sars regressions
        run: node tools/check_v187_player_hector_sars_runtime.mjs

      - name: Run V1.88 player Acupuncture regressions
        run: node tools/check_v188_player_acupuncture_runtime.mjs

      - name: Run V1.89 player Sonic/Regret regressions
        run: node tools/check_v189_player_sonic_regret_runtime.mjs

      - name: Run V1.90 player Firekill regressions
        run: node tools/check_v190_player_firekill_runtime.mjs

      - name: Run V1.91 player Tear regressions
        run: node tools/check_v191_player_tear_runtime.mjs

      - name: Run V1.92 player ShowMercy/BecomePig regressions
        run: node tools/check_v192_player_showmercy_becomepig_runtime.mjs

      - name: Run V1.93 player BatFly/DivideAttack regressions
        run: node tools/check_v193_player_batfly_divideattack_runtime.mjs

      - name: Run V1.94 player Timid regressions
        run: node tools/check_v194_player_timid_runtime.mjs

      - name: Run V1.95 player MagicStatusChange regressions
        run: node tools/check_v195_player_magicstatuschange_runtime.mjs

      - name: Run V1.96 player Abduct regressions
        run: node tools/check_v196_player_abduct_runtime.mjs

      - name: Run V1.97 player Steal regressions
        run: node tools/check_v197_player_steal_runtime.mjs

      - name: Run V1.98 player StealMoney regressions
        run: node tools/check_v198_player_stealmoney_runtime.mjs

      - name: Run V1.99 player AttackCrazed regressions
        run: node tools/check_v199_player_attackcrazed_runtime.mjs

      - name: Run V2.00 player AttackShoot regressions
        run: node tools/check_v200_player_attackshoot_runtime.mjs

      - name: Run V2.01 player BattleModel regressions
        run: node tools/check_v201_player_battlemodel_runtime.mjs

      - name: Run V2.02 player Combined regressions
        run: node tools/check_v202_player_combined_runtime.mjs

      - name: Run V2.03 player field0/1 coverage closure
        run: node tools/check_v203_player_field01_coverage.mjs

      - name: Run V2.04 item field2 runtime regressions
        run: node tools/check_v204_item_field2_runtime.mjs

      - name: Run V2.05 player Fixitem Inslay regressions
        run: node tools/check_v205_player_field2_fixitem_inslay.mjs

      - name: Run V2.06 pet merge-fix runtime regressions
        run: node tools/check_v206_pet_merge_fix_runtime.mjs

      - name: Run V2.07 merge simplify math regressions
        run: node tools/check_v207_merge_simplify_math.mjs

      - name: Run V2.08 merge retry candidate regressions
        run: node tools/check_v208_merge_retry_candidates.mjs

      - name: Run V2.09 merge RNG lifecycle regressions
        run: node tools/check_v209_merge_rng_lifecycle.mjs

      - name: Run V2.10 merge live lifecycle regressions
        run: node tools/check_v210_merge_live_lifecycle.mjs

      - name: Run V2.11 merge live executable fixtures
        run: node tools/check_v211_merge_live_fixtures.mjs

      - name: Run V2.12 special equip boundary regressions
        run: node tools/check_v212_special_equip_boundary.mjs

      - name: Run V2.13 PickAllPet equip callback regressions
        run: node tools/check_v213_pickallpet_equip_callback.mjs

      - name: Run V2.14 NoEnemy equip callback regressions
        run: node tools/check_v214_noenemy_equip_callback.mjs

      - name: Run V2.15 RandEnemy equip callback regressions
        run: node tools/check_v215_randenemy_equip_callback.mjs

      - name: Run V2.16 magic defense equip callback regressions
        run: node tools/check_v216_magic_defense_equip_callback.mjs

      - name: Run V2.17 equip resist callback regressions
        run: node tools/check_v217_equip_resist_callback.mjs

      - name: Run V2.18 suit equip callback regressions
        run: node tools/check_v218_suit_equip_callback.mjs

      - name: Run V2.19 profession magic damage core regressions
        run: node tools/check_v219_profession_magic_damage_core.mjs

      - name: Run V2.20 profession skill runtime regressions
        run: node tools/check_v220_profession_skill_runtime.mjs

      - name: Run V2.21 profession player-state regressions
        run: node tools/check_v221_profession_player_state.mjs

      - name: Run V2.22 profession proficiency regressions
        run: node tools/check_v222_profession_proficiency_runtime.mjs

      - name: Run V2.23 profession live physical hook regressions
        run: node tools/check_v223_profession_live_physical_hooks.mjs

      - name: Run V2.24 profession command/out-of-battle regressions
        run: node tools/check_v224_profession_command_outbattle.mjs

      - name: Run V2.25 profession battle runtime regressions
        run: node tools/check_v225_profession_battle_runtime.mjs

      - name: Run V2.26 dual attack profession regressions
        run: node tools/check_v226_profession_chain_atk2_runtime.mjs

      - name: Run V2.27 shield attack profession regressions
        run: node tools/check_v227_profession_shield_attack_runtime.mjs

      - name: Run V2.28 near-death profession attack regressions
        run: node tools/check_v228_profession_dead_attack_runtime.mjs

      - name: Run V2.29 through attack profession regressions
        run: node tools/check_v229_profession_through_attack_runtime.mjs

      - name: Run V2.30 convolute profession regressions
        run: node tools/check_v230_profession_convolute_runtime.mjs

      - name: Run V2.31 chaos profession regressions
        run: node tools/check_v231_profession_chaos_runtime.mjs

      - name: Run V2.32 Warrior assist profession regressions
        run: node tools/check_v232_profession_warrior_assist_runtime.mjs

      - name: Commit generated runtime
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/generated/stoneage_item_make_runtime.json data/generated/stoneage_item_field2_runtime.json data/generated/stoneage_pet_merge_fix_runtime.json data/generated/stoneage_profession_skill_runtime.json)" ]; then
            echo "Generated runtimes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/stoneage_item_make_runtime.json data/generated/stoneage_item_field2_runtime.json data/generated/stoneage_pet_merge_fix_runtime.json data/generated/stoneage_profession_skill_runtime.json
          git commit -m "V2.04 generate fixed item runtimes"
          git push
