name: Check V4.25 Browser Battle Settlement Receipt-Bound Exit Gate

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_settlement_runtime.mjs'
      - 'src/stoneage_browser_battle_player_exit_runtime.mjs'
      - 'src/stoneage_browser_battle_player_exit_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_exit_runtime.mjs'
      - 'src/stoneage_browser_battle_exit_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_context_clear_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_browser_battle_context_clear_schema.json'
      - 'data/generated/stoneage_browser_battle_settlement_exit_gate_schema.json'
      - 'tools/check_v421_browser_battle_exit.mjs'
      - 'tools/check_v422_browser_battle_player_exit.mjs'
      - 'tools/check_v422_browser_battle_player_exit_commit.mjs'
      - 'tools/check_v425_browser_battle_settlement_exit_gate.mjs'
      - 'tools/check_v425_browser_battle_context_clear.mjs'
      - 'tools/check_browser_battle_context_clear_gate.mjs'
      - 'tools/check_browser_battle_clear_world_loop_gate.mjs'
      - 'tools/check_browser_state_controller_dispatch_serialization.mjs'
  pull_request:
    paths:
      - 'tools/check_browser_battle_clear_world_loop_gate.mjs'
      - 'tools/check_browser_state_controller_dispatch_serialization.mjs'
      - 'src/stoneage_browser_battle_context_clear_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'data/generated/stoneage_browser_battle_context_clear_schema.json'
      - 'tools/check_v425_browser_battle_context_clear.mjs'
      - 'tools/check_browser_battle_context_clear_gate.mjs'
      - 'src/stoneage_browser_battle_settlement_runtime.mjs'
      - 'src/stoneage_browser_battle_player_exit_runtime.mjs'
      - 'src/stoneage_browser_battle_player_exit_commit_runtime.mjs'
      - 'src/stoneage_browser_battle_exit_runtime.mjs'
      - 'src/stoneage_browser_battle_exit_commit_runtime.mjs'
      - 'data/generated/stoneage_browser_battle_settlement_exit_gate_schema.json'
      - 'tools/check_v421_browser_battle_exit.mjs'
      - 'tools/check_v422_browser_battle_player_exit.mjs'
      - 'tools/check_v422_browser_battle_player_exit_commit.mjs'
      - 'tools/check_v425_browser_battle_settlement_exit_gate.mjs'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/check_v421_browser_battle_exit.mjs
      - run: node tools/check_v422_browser_battle_player_exit.mjs
      - run: node tools/check_v422_browser_battle_player_exit_commit.mjs
      - run: node tools/check_v424_browser_battle_settlement_receipt.mjs
      - run: node tools/check_v425_browser_battle_settlement_exit_gate.mjs
      - run: node tools/check_v425_browser_battle_context_clear.mjs
      - run: node tools/check_browser_battle_context_clear_gate.mjs
      - run: node tools/check_browser_battle_clear_world_loop_gate.mjs
      - run: node tools/check_browser_state_controller_dispatch_serialization.mjs
