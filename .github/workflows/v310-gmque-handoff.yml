name: GMQUE handoff source parity

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'tools/check_v310_gmque_handoff.mjs'
      - '.github/workflows/v310-gmque-handoff.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.81 PetSkill pending boundary audit
        run: node tools/check_v281_petskill_reachability.mjs
      - name: Run V3.09 Combo death credit audit
        run: node tools/check_v309_combo_death_credit_itemcrush.mjs
      - name: Run GMQUE handoff source parity regression
        run: node tools/check_v310_gmque_handoff.mjs
