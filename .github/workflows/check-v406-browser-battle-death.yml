name: Check V4.06 Browser Battle Death
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_death_runtime.mjs'
      - 'src/stoneage_browser_battle_counter_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_react_runtime.mjs'
      - 'src/stoneage_browser_battle_critical_damage_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v406_browser_battle_death.mjs'
      - 'data/generated/stoneage_browser_battle_death_schema.json'
      - 'docs/reference/v406-browser-battle-death.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v406-browser-battle-death.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V4.01 through V4.06 regressions
        run: |
          node tools/check_v401_browser_battle_attack_seq_prelude.mjs
          node tools/check_v402_browser_battle_damage_plan.mjs
          node tools/check_v403_browser_battle_critical_damage.mjs
          node tools/check_v404_browser_battle_damage_react.mjs
          node tools/check_v405_browser_battle_counter.mjs
          node tools/check_v406_browser_battle_death.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_death_runtime.mjs
          node --check src/stoneage_browser_battle_counter_runtime.mjs
          node --check src/stoneage_browser_battle_damage_react_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v406_browser_battle_death.mjs
