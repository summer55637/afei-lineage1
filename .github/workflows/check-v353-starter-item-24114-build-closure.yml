name: Check V3.53 starter Item 24114 build closure

on:
  push:
    paths:
      - 'data/generated/stoneage_starter_item_24114_build_closure_audit.json'
      - 'data/generated/stoneage_item_make_runtime.json'
      - 'tools/check_v353_starter_item_24114_build_closure.mjs'
      - 'docs/reference/v353-starter-item-24114-build-closure.md'
      - '.github/workflows/check-v353-starter-item-24114-build-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-item-build-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          git -C /tmp/StoneAge fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C /tmp/StoneAge checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
      - name: Verify repository-defined build closure
        run: |
          grep -q '^CFLAGS=-w -O3 \$(INCFLAGS)$' /tmp/StoneAge/gmsv/src/Makefile
          grep -q '^CFLAGS=-w -O3 \$(INCFLAGS)$' /tmp/StoneAge/gmsv/src/item/makefile
          ! grep -q '^[[:space:]]*#define[[:space:]]_IMPOROVE_ITEMTABLE' /tmp/StoneAge/gmsv/src/include/version.h
          grep -q '^#define _ITEMSET6_TXT' /tmp/StoneAge/gmsv/src/include/version.h
          grep -q '^ITEM1=24114$' /tmp/StoneAge/gmsv/setup.cf
          grep -q '^itemset6file=data/itemset6.txt$' /tmp/StoneAge/gmsv/setup.cf
          test "$(git -C /tmp/StoneAge hash-object gmsv/data/itemset6.txt)" = "eac985796b59286c547db2abce7b3d604a5e6226"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/StoneAge/gmsv/data/itemset6.txt').read_bytes().splitlines()
          rows=[]
          max_id=-1
          configured=[]
          for lineno,raw in enumerate(lines,1):
              tokens=raw.decode('latin1').split(',')
              if not raw or raw.lstrip().startswith(b'#') or len(tokens)<17:
                  continue
              try:
                  item_id=int(tokens[16].strip())
              except ValueError:
                  continue
              rows.append((lineno,item_id))
              max_id=max(max_id,item_id)
              if item_id==24114:
                  configured.append(lineno)
          assert len(rows)==10737, len(rows)
          assert max_id==23009, max_id
          assert configured==[], configured
          row=None
          for lineno,item_id in rows:
              if lineno==3602:
                  row=lines[lineno-1].decode('latin1').split(',')
                  break
          assert row[16].strip()=='11817'
          assert row[17].strip()=='24114'
          assert row[18].strip()=='9900'
          assert row[19].strip()=='16'
          print({'rows':len(rows),'maxSourceItemId':max_id,'tableLength':max_id+1,'configuredId':24114,'configuredIdWithinTable':24114 < max_id+1,'row3602':[row[16].strip(),row[17].strip(),row[18].strip(),row[19].strip()]})
          PY
      - name: Run V3.53 regression
        run: node tools/check_v353_starter_item_24114_build_closure.mjs
