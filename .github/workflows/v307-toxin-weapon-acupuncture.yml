name: V3.07 Toxin Weapon Acupuncture WakeUp order

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/changelog/part-07-v1.75-onward.md'
      - 'tools/check_v305_caller_sensitive_acupuncture_wakeup.mjs'
      - 'tools/check_v306_gbreak_fallground_acupuncture_order.mjs'
      - 'tools/check_v307_toxin_weapon_acupuncture_order.mjs'
      - '.github/workflows/v307-toxin-weapon-acupuncture.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V3.05 caller-sensitive Acupuncture audit
        run: node tools/check_v305_caller_sensitive_acupuncture_wakeup.mjs
      - name: Run V3.06 GBreak / GBreak2 / FallGround Acupuncture audit
        run: node tools/check_v306_gbreak_fallground_acupuncture_order.mjs
      - name: Run V3.07 Toxin Weapon Acupuncture audit
        run: node tools/check_v307_toxin_weapon_acupuncture_order.mjs
