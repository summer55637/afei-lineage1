name: Check endpoint completeness audit

on:
  workflow_run:
    workflows:
      - Maintain README status
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-endpoint-completeness-main
  cancel-in-progress: true

jobs:
  endpoint-completeness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check raw ro0000 integrity
        run: node tools/check_ro0000_integrity.mjs

      - name: Check endpoint completeness audit
        run: node tools/check_endpoint_completeness.mjs --check
