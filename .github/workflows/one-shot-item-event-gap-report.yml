name: one-shot-item-event-gap-report

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate gap report
        run: node tools/generate_item_event_gap_report.mjs
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-item-event-gap-report.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_item_event_gap_report.json tools/generate_item_event_gap_report.mjs .github/workflows/one-shot-item-event-gap-report.yml
          git commit -m 'data: add item event source gap report'
          git push origin HEAD:main