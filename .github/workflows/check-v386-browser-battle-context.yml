name: Check V3.86 Browser Battle Context
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_context_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_world_encounter_enemy_runtime.mjs'
      - 'src/stoneage_browser_world_encounter_idle_bridge.mjs'
      - 'src/stoneage_idle_persistent_state_runtime.mjs'
      - 'src/stoneage_idle_loop.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'data/generated/stoneage_first_idle_route_catalog.json'
      - 'data/generated/stoneage_start_encounter_target_index.json'
      - 'data/generated/stoneage_browser_battle_context_schema.json'
      - 'tools/check_v384_browser_world_encounter_enemy_runtime.mjs'
      - 'tools/check_v385_browser_world_encounter_idle_bridge.mjs'
      - 'tools/check_v386_browser_battle_context_runtime.mjs'
      - 'docs/reference/v386-browser-battle-context.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v386-browser-battle-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.83 through V3.86 battle pipeline regressions
        run: |
          node tools/check_v383_browser_world_encounter_group_runtime.mjs
          node tools/check_v384_browser_world_encounter_enemy_runtime.mjs
          node tools/check_v385_browser_world_encounter_idle_bridge.mjs
          node tools/check_v386_browser_battle_context_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_context_runtime.mjs
          node --check src/stoneage_browser_world_encounter_group_runtime.mjs
          node --check src/stoneage_browser_world_encounter_enemy_runtime.mjs
          node --check src/stoneage_browser_world_encounter_idle_bridge.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v386_browser_battle_context_runtime.mjs
