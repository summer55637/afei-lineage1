name: V3.13 LS2MAP parser contract

on:
  push:
    paths:
      - 'tools/check_v313_source_map_runtime_api.mjs'
      - 'tools/check_v313_source_map_world_hud.mjs'
      - 'game.css'
      - 'start.html'
      - 'game.js'
      - 'tools/stoneage_ls2map_parser.mjs'
      - 'tools/check_v313_ls2map_parser.mjs'
      - 'data/generated/stoneage_map_20000.json'
      - 'data/generated/stoneage_map_runtime_index.json'
      - 'src/stoneage_map_runtime.mjs'
      - 'tools/check_v313_map_20000_runtime.mjs'
      - 'docs/reference/v313-ls2map-parser-contract.md'
      - '.github/workflows/v313-ls2map-parser.yml'
  pull_request:
    paths:
      - 'tools/stoneage_ls2map_parser.mjs'
      - 'tools/check_v313_ls2map_parser.mjs'
      - 'docs/reference/v313-ls2map-parser-contract.md'
      - '.github/workflows/v313-ls2map-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run game.js syntax check
        run: node --check game.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V3.13 LS2MAP parser regression
        run: node tools/check_v313_ls2map_parser.mjs
      - name: Run V3.13 verified floor 20000 runtime regression
        run: node tools/check_v313_map_20000_runtime.mjs
      - name: Run V3.13 source map runtime API regression
        run: node tools/check_v313_source_map_runtime_api.mjs
      - name: Run V3.13 source map world HUD regression
        run: node tools/check_v313_source_map_world_hud.mjs