name: Check V4.14 Browser Battle Level-Up Plan

on:
  push:
    paths:
      - 'src/stoneage_browser_battle_levelup_runtime.mjs'
      - 'src/stoneage_browser_battle_exp_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_exp_table.json'
      - 'data/generated/stoneage_browser_battle_levelup_schema.json'
      - 'tools/check_v414_browser_battle_levelup.mjs'
  pull_request:
    paths:
      - 'src/stoneage_browser_battle_levelup_runtime.mjs'
      - 'src/stoneage_browser_battle_exp_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_exp_table.json'
      - 'data/generated/stoneage_browser_battle_levelup_schema.json'
      - 'tools/check_v414_browser_battle_levelup.mjs'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_v414_browser_battle_levelup.mjs
