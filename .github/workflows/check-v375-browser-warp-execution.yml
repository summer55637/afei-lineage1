
name: Check V3.75 Browser Warp execution
on:
  push:
    paths:
      - src/stoneage_browser_state_controller.mjs
      - src/stoneage_browser_warp_runtime.mjs
      - src/stoneage_save_transaction.mjs
      - src/stoneage_persistent_state.mjs
      - tools/generate_browser_start_warp_catalog.mjs
      - tools/check_v375_browser_warp_execution.mjs
      - data/generated/stoneage_browser_start_warp_catalog.json
      - data/generated/stoneage_browser_warp_schema.json
      - docs/reference/v375-browser-warp-execution.md
      - docs/rebuild-roadmap.md
      - .github/workflows/check-v375-browser-warp-execution.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Generate V3.75 pinned-source Warp catalog
        run: |
          node tools/generate_browser_start_warp_catalog.mjs             --source-root fixed-c-source             --out /tmp/v375-browser-start-warp/stoneage_browser_start_warp_catalog.json
      - name: Run V3.75 Browser Warp regression
        run: |
          node tools/check_v375_browser_warp_execution.mjs             fixed-c-source             /tmp/v375-browser-start-warp/stoneage_browser_start_warp_catalog.json
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_state_controller.mjs
          node --check src/stoneage_browser_warp_runtime.mjs
          node --check tools/generate_browser_start_warp_catalog.mjs
          node --check tools/check_v375_browser_warp_execution.mjs
