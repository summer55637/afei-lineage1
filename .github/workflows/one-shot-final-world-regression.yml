name: one-shot-final-world-regression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regressions
        run: |
          node tools/check_world_data_catalog.mjs
          node tools/check_world_npc_and_map_audit.mjs
          node tools/check_npc_service_index.mjs
          node tools/check_npc_event_action_index.mjs
          node tools/check_aux_world_data_index.mjs
      - name: Verify no playable HTML
        run: |
          test -z "$(find . -type f \( -name '*.html' -o -name '*.htm' -o -name '*.xhtml' \) -not -path './.git/*' -print -quit)"
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-final-world-regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-final-world-regression.yml
          git commit -m 'ci: remove final world regression'
          git push origin HEAD:main