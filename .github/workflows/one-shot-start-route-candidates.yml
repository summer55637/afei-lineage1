name: one-shot-start-route-candidates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout fixed source
        run: |
          rm -rf /tmp/StoneAge
          git clone --quiet https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          cd /tmp/StoneAge
          git checkout --quiet 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          test "$(git rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
      - name: Generate route candidates
        run: node tools/generate_start_route_candidates.mjs --source-root /tmp/StoneAge --out data/generated/stoneage_start_route_candidates.json
      - name: Commit route candidates and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-start-route-candidates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_start_route_candidates.json tools/generate_start_route_candidates.mjs .github/workflows/one-shot-start-route-candidates.yml
          git commit -m 'data: generate source-backed start route candidates'
          git push origin HEAD:main
