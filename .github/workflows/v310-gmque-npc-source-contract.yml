name: V3.10 GMQUE NPC source contract

on:
  push:
    paths:
      - 'game.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'data/generated/stoneage_gmque_source_closure.json'
      - 'docs/reference/gmque-npc-source-contract.md'
      - 'tools/check_v310_gmque_npc_source_contract.mjs'
      - '.github/workflows/v310-gmque-npc-source-contract.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run GMQUE NPC source contract regression
        run: node tools/check_v310_gmque_npc_source_contract.mjs
      - name: Run GMQUE source closure regression
        run: node tools/check_v310_gmque_source_closure.mjs
