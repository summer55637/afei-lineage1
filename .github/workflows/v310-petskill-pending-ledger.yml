name: V3.10 PetSkill pending ledger

on:
  push:
    branches: [main]
    paths:
      - game.js
      - README.md
      - CHANGELOG.md
      - docs/reference/video-001-visual-reference.md
      - tools/check_v310_petskill_pending_ledger.mjs
      - .github/workflows/v310-petskill-pending-ledger.yml
  pull_request:
    branches: [main]
    paths:
      - game.js
      - README.md
      - CHANGELOG.md
      - docs/reference/video-001-visual-reference.md
      - tools/check_v310_petskill_pending_ledger.mjs
      - .github/workflows/v310-petskill-pending-ledger.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check game.js
        run: node --check game.js

      - name: Run V3.10 PetSkill pending ledger regression
        run: node tools/check_v310_petskill_pending_ledger.mjs
