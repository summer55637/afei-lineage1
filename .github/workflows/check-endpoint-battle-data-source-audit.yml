name: Check endpoint battle data source audit

on:
  push:
    branches:
      - main
    paths:
      - 'ro0000/server/merged-source/gmsv/data/encount.txt'
      - 'ro0000/server/merged-source/gmsv/data/group1.txt'
      - 'ro0000/server/merged-source/gmsv/data/enemy1.txt'
      - 'ro0000/server/merged-source/gmsv/data/enemybase1.txt'
      - 'data/generated/stoneage_endpoint_battle_data_source_audit.json'
      - 'data/generated/stoneage_endpoint_start_encounter_group_closure.json'
      - 'tools/generate_endpoint_start_encounter_group_closure.mjs'
      - 'tools/check_endpoint_battle_data_source_audit.mjs'
      - 'docs/reference/endpoint-battle-data-source-audit.md'
      - '.github/workflows/check-endpoint-battle-data-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-battle-data-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone pinned fixed-C source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56

      - name: Check endpoint battle data audit
        run: node tools/check_endpoint_battle_data_source_audit.mjs --check

      - name: Check endpoint first-route Encounter to Group closure
        run: node tools/generate_endpoint_start_encounter_group_closure.mjs --check --fixed-source-root fixed-c-source