name: Check V4.03 Browser Battle Critical Damage
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_critical_damage_runtime.mjs'
      - 'src/stoneage_browser_battle_damage_plan_runtime.mjs'
      - 'src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v403_browser_battle_critical_damage.mjs'
      - 'data/generated/stoneage_browser_battle_critical_damage_schema.json'
      - 'docs/reference/v403-browser-battle-critical-damage.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v403-browser-battle-critical-damage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V4.01, V4.02 and V4.03 regressions
        run: |
          node tools/check_v401_browser_battle_attack_seq_prelude.mjs
          node tools/check_v402_browser_battle_damage_plan.mjs
          node tools/check_v403_browser_battle_critical_damage.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_critical_damage_runtime.mjs
          node --check src/stoneage_browser_battle_damage_plan_runtime.mjs
          node --check src/stoneage_browser_battle_attack_seq_prelude_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v403_browser_battle_critical_damage.mjs
