name: Check endpoint NPC source audit

on:
  push:
    branches:
      - main
    paths:
      - 'ro0000/server/merged-source/gmsv/data/npc/**'
      - 'data/generated/stoneage_endpoint_npc_source_audit.json'
      - 'tools/check_endpoint_npc_source_audit.mjs'
      - 'docs/reference/endpoint-npc-source-audit.md'
      - '.github/workflows/check-endpoint-npc-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-npc-source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve endpoint NPC tree
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          echo "tree_sha=$(git rev-parse HEAD:ro0000/server/merged-source/gmsv/data/npc)" >> "$GITHUB_OUTPUT"

      - name: Clone pinned fixed-C source
        id: fixed
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/gavinlinasd/StoneAge.git fixed-c-source
          git -C fixed-c-source fetch --depth 1 origin 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          git -C fixed-c-source checkout --detach 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          echo "tree_sha=$(git -C fixed-c-source rev-parse HEAD:gmsv/data/npc)" >> "$GITHUB_OUTPUT"

      - name: Check endpoint NPC audit
        env:
          ENDPOINT_NPC_TREE_SHA: ${{ steps.endpoint.outputs.tree_sha }}
          FIXED_NPC_TREE_SHA: ${{ steps.fixed.outputs.tree_sha }}
        run: node tools/check_endpoint_npc_source_audit.mjs --check
