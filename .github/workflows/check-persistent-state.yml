name: Check persistent state schema

on:
  push:
    paths:
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_persistent_state_schema.json'
      - 'tools/check_persistent_state_schema.mjs'
      - 'src/stoneage_idle_loop.mjs'
      - 'data/generated/stoneage_idle_loop_contract.json'
      - 'tools/check_idle_loop_contract.mjs'
      - 'data/generated/stoneage_first_idle_route_catalog.json'
      - 'tools/check_first_idle_route_catalog.mjs'
      - 'data/generated/stoneage_idle_policy_schema.json'
      - 'data/generated/stoneage_reward_transaction_schema.json'
      - 'tools/check_idle_policy.mjs'
      - 'tools/check_save_transaction.mjs'
      - 'src/stoneage_save_transaction.mjs'
      - 'src/stoneage_save_storage.mjs'
      - 'tools/check_save_storage.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_browser_persistent_state_session.mjs'
      - 'tools/check_idle_simulation.mjs'
      - 'src/stoneage_idle_simulation.mjs'
      - 'src/stoneage_offline_resume.mjs'
      - 'tools/check_offline_resume.mjs'
      - 'src/stoneage_battle_result_adapter.mjs'
      - 'tools/check_battle_result_adapter.mjs'
      - 'tools/check_reward_transaction.mjs'
      - 'src/stoneage_item_economy_runtime.mjs'
      - 'data/generated/stoneage_item_economy_runtime_schema.json'
      - 'tools/check_item_economy_runtime.mjs'
      - 'src/stoneage_idle_policy.mjs'
      - 'src/stoneage_reward_transaction.mjs'
      - '.github/workflows/check-persistent-state.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run persistent state regression
        run: node tools/check_persistent_state_schema.mjs
      - name: Run idle loop regression
        run: node tools/check_idle_loop_contract.mjs
      - name: Run first idle route regression
        run: node tools/check_first_idle_route_catalog.mjs
      - name: Run reward transaction regression
        run: node tools/check_reward_transaction.mjs
      - name: Run idle policy regression
        run: node tools/check_idle_policy.mjs
      - name: Run item economy regression
        run: node tools/check_item_economy_runtime.mjs
      - name: Run save transaction regression
        run: node tools/check_save_transaction.mjs
      - name: Run save storage regression
        run: node tools/check_save_storage.mjs
      - name: Run battle result adapter regression
        run: node tools/check_battle_result_adapter.mjs
      - name: Run offline resume regression
        run: node tools/check_offline_resume.mjs
      - name: Run idle simulation regression
        run: node tools/check_idle_simulation.mjs
