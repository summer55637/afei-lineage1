name: Check persistent state schema

on:
  push:
    paths:
      - 'src/stoneage_persistent_state.mjs'
      - 'data/generated/stoneage_persistent_state_schema.json'
      - 'tools/check_persistent_state_schema.mjs'
      - 'src/stoneage_idle_loop.mjs'
      - 'data/generated/stoneage_idle_loop_contract.json'
      - 'tools/check_idle_loop_contract.mjs'
      - '.github/workflows/check-persistent-state.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run persistent state regression
        run: node tools/check_persistent_state_schema.mjs
      - name: Run idle loop regression
        run: node tools/check_idle_loop_contract.mjs
