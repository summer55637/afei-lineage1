name: Check V3.39 canonical browser shell

on:
  push:
    paths:
      - 'index.html'
      - 'src/stoneage_canonical_browser_shell.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'src/stoneage_npc_runtime_config.mjs'
      - 'src/stoneage_npc_dispatch_runtime.mjs'
      - 'src/stoneage_first_route_save.mjs'
      - 'src/stoneage_first_route_reward_handlers.mjs'
      - 'tools/check_v339_canonical_browser_shell.mjs'
      - 'docs/reference/v339-canonical-browser-shell.md'
      - '.github/workflows/check-v339-canonical-browser-shell.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          node --check src/stoneage_canonical_browser_shell.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v339_canonical_browser_shell.mjs
      - name: Run V3.39 regression
        run: node tools/check_v339_canonical_browser_shell.mjs
