name: V2.88 pre-DamageReact Counter boundary

on:
  push:
    paths:
      - 'game.js'
      - 'game.html'
      - 'README.md'
      - 'tools/check_v286_source_closure_audit.mjs'
      - 'tools/check_v288_damagereact_counter_boundary.mjs'
      - '.github/workflows/v288-damagereact-counter.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V2.86 source closure audit
        run: node tools/check_v286_source_closure_audit.mjs
      - name: Run V2.88 DamageReact Counter boundary audit
        run: node tools/check_v288_damagereact_counter_boundary.mjs
