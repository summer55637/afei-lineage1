name: V3.11 battle target marker

on:
  push:
    paths:
      - 'start.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v311_battle_target_marker.mjs'
      - 'docs/reference/v311-battle-target-marker-source-notes.md'
      - '.github/workflows/v311-battle-target-marker.yml'
  pull_request:
    paths:
      - 'start.html'
      - 'game.css'
      - 'game.js'
      - 'tools/check_v311_battle_target_marker.mjs'
      - 'docs/reference/v311-battle-target-marker-source-notes.md'
      - '.github/workflows/v311-battle-target-marker.yml'
  workflow_dispatch:

jobs:
  target-marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V3.11 target marker regression
        run: node tools/check_v311_battle_target_marker.mjs