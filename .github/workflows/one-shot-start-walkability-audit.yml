name: one-shot-start-walkability-audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout fixed source
        run: |
          rm -rf /tmp/StoneAge
          git clone --quiet https://github.com/gavinlinasd/StoneAge.git /tmp/StoneAge
          cd /tmp/StoneAge
          git checkout --quiet 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          test "$(git rev-parse HEAD)" = "1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56"
      - name: Audit spawn to warp walkability
        run: |
          node tools/audit_start_walkability.mjs --source-root /tmp/StoneAge --out data/generated/stoneage_start_walkability_audit.json
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-start-walkability-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated/stoneage_start_walkability_audit.json tools/audit_start_walkability.mjs .github/workflows/one-shot-start-walkability-audit.yml
          git commit -m 'data: audit start spawn walkability to warp exits'
          git push origin HEAD:main
