name: Check V3.60 SavePoint World source join

on:
  push:
    paths:
      - 'tools/check_v360_savepoint_world_join.mjs'
      - 'tools/generate_world_data_catalog.mjs'
      - 'tools/generate_savepoint_source_catalog.mjs'
      - 'data/generated/stoneage_npc_service_index.json'
      - 'docs/reference/v360-savepoint-world-join.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v360-savepoint-world-join.yml'
      - 'src/stoneage_browser_savepoint_runtime.mjs'
      - 'tools/check_v359_browser_savepoint_getitem_transaction.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout pinned fixed-C source
        uses: actions/checkout@v4
        with:
          repository: gavinlinasd/StoneAge
          ref: 1f90cb6cb57c1df70f39cde77a5a8ccd98b66c56
          path: fixed-c-source
          fetch-depth: 1
      - name: Run V3.60 World SavePoint join regression
        run: node tools/check_v360_savepoint_world_join.mjs fixed-c-source
      - name: Run V3.59 transaction regression
        run: node tools/check_v359_browser_savepoint_getitem_transaction.mjs
      - name: Upload V3.60 join evidence
        uses: actions/upload-artifact@v4
        with:
          name: v360-savepoint-world-join
          path: /tmp/v360-savepoint-world
      - name: Check JavaScript syntax
        run: |
          node --check tools/check_v360_savepoint_world_join.mjs
          node --check tools/generate_world_data_catalog.mjs
          node --check tools/generate_savepoint_source_catalog.mjs
          node --check src/stoneage_browser_savepoint_runtime.mjs
          node --check tools/check_v359_browser_savepoint_getitem_transaction.mjs
