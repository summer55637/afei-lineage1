name: Check V3.99 Browser Battle Default Target Runtime
on:
  push:
    paths:
      - 'src/stoneage_browser_battle_default_target_runtime.mjs'
      - 'src/stoneage_browser_battle_target_runtime.mjs'
      - 'src/stoneage_browser_state_controller.mjs'
      - 'tools/check_v398_browser_battle_target_runtime.mjs'
      - 'tools/check_v399_browser_battle_default_target_runtime.mjs'
      - 'data/generated/stoneage_browser_battle_default_target_schema.json'
      - 'docs/reference/v398-browser-battle-target-runtime.md'
      - 'docs/reference/v399-browser-battle-default-target-runtime.md'
      - 'docs/rebuild-roadmap.md'
      - '.github/workflows/check-v399-browser-battle-default-target-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V3.98 and V3.99 target regressions
        run: |
          node tools/check_v398_browser_battle_target_runtime.mjs
          node tools/check_v399_browser_battle_default_target_runtime.mjs
      - name: Check JavaScript syntax
        run: |
          node --check src/stoneage_browser_battle_default_target_runtime.mjs
          node --check src/stoneage_browser_battle_target_runtime.mjs
          node --check src/stoneage_browser_state_controller.mjs
          node --check tools/check_v399_browser_battle_default_target_runtime.mjs
