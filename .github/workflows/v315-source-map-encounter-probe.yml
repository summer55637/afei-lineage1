name: V3.15 source-map encounter probe

on:
  push:
    paths:
      - 'game.js'
      - 'start.html'
      - 'src/stoneage_map_runtime.mjs'
      - 'data/generated/stoneage_map_runtime_index.json'
      - 'tools/check_v315_source_map_encounter_probe.mjs'
      - 'docs/reference/v315-source-map-encounter-probe.md'
      - '.github/workflows/v315-source-map-encounter-probe.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'start.html'
      - 'src/stoneage_map_runtime.mjs'
      - 'data/generated/stoneage_map_runtime_index.json'
      - 'tools/check_v315_source_map_encounter_probe.mjs'
      - 'docs/reference/v315-source-map-encounter-probe.md'
      - '.github/workflows/v315-source-map-encounter-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game.js syntax
        run: node --check game.js
      - name: Run V3.15 encounter coordinate source probe regression
        run: node tools/check_v315_source_map_encounter_probe.mjs